// A made-up tuning in the shape of a Radar's AFE.cfg, for LoadRadarTuning's
// tests. None of these numbers are stock's.
{
    "Path Definition":
        {
            "Playback":
                {
                    "Algorithms":
                        {
                            // "AVL"        : "Automatic Volume Leveling",
                            "EQ"            : "Equalizer FIR",
                            "ParametricEQ"  : "Parametric EQ",
                            "MBCL"          : "MBCL",
                            "OutputTrim"    : "OutputTrim"
                        }
                }
        },
    "Algorithm Definition":
        {
            "Equalizer FIR":
                {
                    "Bypass"                : false,
                    "External Coefficients" : [ "EQ_quiet.cfg", "EQ_loud.cfg" ],
                    "Volume Boundary"       : [ 40, 100 ]
                },
            "Parametric EQ": { "External Config" : "PEQ.cfg" },
            "MBCL":          { "External Config" : [ "MBCL.cfg" ] },
            "OutputTrim":    { "GaindB" : 1.5 },
            "Automatic Volume Leveling": { "Bypass" : true }
        }
}
