name: "EchoMuse"
# Tracks the published controller image tag, which controller-release.yml
# derives from the controller-v* tag (controller-v2.18.0 -> 2.18.0). Bump
# both together: Supervisor pulls `image:version`, so a version with no
# matching tag on GHCR fails to install.
version: "2.20.1"
# Pull the published multi-arch image rather than building on the user's
# machine. Without this Supervisor builds from this directory's Dockerfile,
# which downloads a few hundred MB on whatever the user runs Home Assistant
# on and cannot pass the EM_CONTROLLER_VERSION build arg — so the controller
# reports "dev" and the update notice goes quiet. controller-release.yml
# already publishes linux/amd64 and linux/arm64, matching the arch list below.
#
# The build does NOT compile anything, contrary to what this comment claimed
# until 2026-08-14: ffmpeg is apt, and onnxruntime, speexdsp-ns, scipy and
# scikit-learn all resolve to prebuilt wheels on this base image — see
# controller-release.yml, which relies on exactly that for its arm64 build.
# The distinction matters because a local build is the only way to test
# add-on changes before they reach main (Supervisor clones the default
# branch), and "it compiles onnxruntime" made that loop look far more
# expensive than it is. tools/make_dev_addon.sh packages one.
image: "ghcr.io/wilbowes/echomuse-controller"
slug: "controller"
description: "Local, open-source voice assistant controller for rooted Echo Dot 2nd Gen devices — wake word, fleet dashboard, and Home Assistant integration via ESPHome."
url: "https://github.com/wilbowes/EchoMuse"
init: false
arch:
  - aarch64
  - amd64
# Required for mDNS controller discovery and the per-device ESPHome native
# API listeners (one TCP port per device, 16001+) — same reason the
# docker-compose deployment sets network_mode: host. Without it, devices on
# the LAN cannot find or connect to the controller.
host_network: true
ingress: true
ingress_port: 8768
# Admin-only sidebar entry. This is Supervisor's default, set explicitly
# because the dashboard authenticates whoever Home Assistant forwards
# (em_ingressauth) and proxies a root shell to every device — so a change to
# that default must not quietly widen who can reach it. Note it governs the
# menu entry; EchoMuse does not assume it gates the ingress URL, which is
# why only the FIRST Home Assistant user becomes admin and the rest are
# read-only until promoted.
panel_admin: true
panel_icon: mdi:microphone-message
panel_title: EchoMuse
environment:
  ECHOMUSE_HOME_ASSISTANT_INGRESS: "true"
  # /data is the add-on's own persistent storage, provided automatically by
  # Supervisor — fixed rather than a user option so the database can't be
  # pointed somewhere that doesn't survive a restart.
  DB_PATH: "/data/echomuse.db"
options:
  server_host: "0.0.0.0"
  server_ip: ""
  mdns_name: "echomuse"
  esphome_project_version: "2.0.0"
  # Base for the per-device ESPHome satellite ports. Differs per release
  # channel so the two add-ons hand out disjoint ranges — see em_db's
  # ESPHOME_PORT_BASE and sync_channels.py, which rewrites this line.
  esphome_port_base: 16001
  oww_model: "hey_jarvis"
  # Keep in step with em_db.DEFAULT_DEVICE_CONFIG["owwThreshold"] — a fresh
  # add-on install is precisely the case that default exists for, and
  # test_addon_default_threshold_matches_the_controller pins the pair.
  oww_threshold: 0.5
  require_device_tls: false
  device_approval: "strict"
  debug: false
schema:
  server_host: "str"
  server_ip: "str"
  mdns_name: "match(^[a-z0-9][a-z0-9-]{0,62}$)"
  esphome_project_version: "str"
  esphome_port_base: "int(1024,60000)"
  oww_model: "str"
  oww_threshold: "float(0,1)"
  require_device_tls: "bool"
  device_approval: "list(strict|auto)"
  debug: "bool"
