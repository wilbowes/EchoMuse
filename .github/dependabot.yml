version: 2

# Four ecosystems, because the controller image is assembled from all four and
# a gap in any one of them is invisible: Python wheels, the Debian base image,
# the device's Go modules, and the actions this repo's own workflows run.
#
# Everything is GROUPED into one PR per ecosystem per week. Ungrouped, this
# config produces a dozen individual PRs against a repo maintained by one
# person, and a review queue nobody can clear is the same as no scanning at
# all — worse, because it looks like coverage.
#
# Note what Dependabot structurally cannot see here, so nobody reads a green
# board as "everything is covered":
#   - openwakeword is installed in the Dockerfile with --no-deps, not from
#     requirements.txt, so its pin is invisible to the pip ecosystem below.
#   - SpeexDSP is vendored C source in device/internal/aec/ with no package
#     metadata at all.
#   - ONNX Runtime is dlopen'd on the device, pinned by AAR sha256 in the
#     asset path rather than by any manifest.
# Those three are tracked by reading the pins, which is a human job.

updates:
  # ── Controller Python dependencies ──────────────────────────────────────
  - package-ecosystem: pip
    directory: /controller
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      python-dependencies:
        patterns: ["*"]
    # Bumps of these two are not routine maintenance and should not arrive as
    # a weekly PR: numpy majors have broken openwakeword's array handling
    # before, and an onnxruntime bump changes inference behaviour on every
    # device at once. Both want a deliberate upgrade with a wake word test
    # behind it.
    #
    # onnxruntime is ignored on MINOR too, and that is the whole point rather
    # than caution: it has never bumped major and shows no sign of doing so,
    # so a major-only rule can never fire and protects nothing. #129 proposed
    # 1.20.1 -> 1.28.0 — eight minor versions, exactly the change described
    # above — as an ordinary weekly PR, alongside bumps that genuinely were
    # routine. Nothing in CI can catch an inference regression, so the guard
    # has to be here or it does not exist.
    ignore:
      - dependency-name: numpy
        update-types: ["version-update:semver-major"]
      - dependency-name: onnxruntime
        update-types:
          - version-update:semver-major
          - version-update:semver-minor

  # ── Controller base image ───────────────────────────────────────────────
  # python:3.12-slim is where ffmpeg, curl and the whole Debian layer come
  # from — the majority of what any image scan reports.
  #
  # The Python version is NOT ours to choose: it is the highest one every
  # pinned wheel publishes for, and today that is 3.12. Measured on PyPI
  # 2026-08-18, for the versions requirements.txt actually pins:
  #
  #   speexdsp-ns 0.1.2  cp37 … cp312     <- the binding constraint
  #   onnxruntime 1.20.1 cp310 … cp313
  #   numpy       2.4.4  cp311 … cp314
  #
  # Neither builds from source in this image, so a bump past the lowest of
  # those does not degrade — it fails to build. #127 proposed 3.14 and
  # carried seven green checks, because until ci.yml gained the
  # controller-image job nothing built the image on a PR at all.
  #
  # So majors and minors are ignored and moving Python is a deliberate
  # upgrade: check the wheels first, then bump this and requirements.txt
  # together.
  #
  # That leaves this ecosystem quiet, which is correct and worth stating so
  # nobody reads the silence as coverage: `python:3.12-slim` is a FLOATING
  # tag, so Debian security fixes arrive by rebuilding, not by a PR here.
  # security-scan.yml is what watches for them — it scans the published
  # image on a schedule precisely because the digest can go stale while the
  # tag stands still.
  - package-ecosystem: docker
    directory: /controller
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: python
        update-types:
          - version-update:semver-major
          - version-update:semver-minor

  # ── Device Go modules ───────────────────────────────────────────────────
  # The GoTinyAlsa replace directive points at a submodule path, which
  # Dependabot skips; that fork is tracked by hand because it carries a fix
  # not yet merged upstream (see CLAUDE.md).
  - package-ecosystem: gomod
    directory: /device
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      go-dependencies:
        patterns: ["*"]

  # ── GitHub Actions ──────────────────────────────────────────────────────
  # Workflow actions run with repository credentials, so a stale pinned
  # action is a supply chain exposure in its own right, not just tidiness.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ["*"]
