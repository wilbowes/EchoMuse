name: Device Release (firmware binary)

# Device firmware releases keep plain vX.Y.Z tags — the tag is embedded in
# the binary via -ldflags and compared against firmware_ver by the OTA
# system, so this scheme must not change. Controller releases use
# controller-v* tags (see controller-release.yml), which don't match this
# glob and create no GitHub Release, so OTA's release polling never sees them.
#
# Early Access firmware is vX.Y.Z-ea.N, published as a GitHub PRERELEASE.
# Every GA controller since 2.22.0 skips prereleases when it chooses firmware,
# so an EA build can never reach the GA fleet; EA and dev controllers include
# them (em_api._fetch_latest_release, version.firmware_key).

on:
  push:
    tags:
      - 'v*'

# Read-only unless a job asks for more. The repository's default token is
# already read-only; this keeps it so if that setting ever changes.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write       # provenance attestation (Sigstore OIDC)
      attestations: write

    steps:
      # The tag reaches a shell below, and git allows $ ( ) ; in a tag name.
      # Every firmware tag ever cut matches this; anything else is refused
      # before it can be interpolated anywhere.
      - name: Refuse a malformed tag
        run: |
          echo "$GITHUB_REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-ea\.[0-9]+)?$' || {
            echo "::error::$GITHUB_REF_NAME is not vX.Y.Z or vX.Y.Z-ea.N"; exit 1; }

      # An EA tag is published as a prerelease, which GA controllers skip.
      - name: Channel
        id: channel
        run: |
          case "$GITHUB_REF_NAME" in
            *-ea.*) echo "prerelease=true"  >> "$GITHUB_OUTPUT" ;;
            *)      echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true   # fetches GoTinyAlsa submodule

      - name: Build compiler image
        run: docker build -t echomuse-compiler device/compiler/

      - name: Compile
        run: |
          mkdir -p device/build
          docker run --rm \
            --entrypoint bash \
            -e CGO_LDFLAGS="-Wl,--hash-style=both" \
            -v "${{ github.workspace }}/device":/sdk \
            -v "${{ github.workspace }}/GoTinyAlsa":/GoTinyAlsa \
            echomuse-compiler \
            -c "cd /sdk && mkdir -p build && go build \
              -tags server \
              -ldflags \"-X github.com/wilbowes/EchoMuse/internal/client.Version=$GITHUB_REF_NAME \
                         -X github.com/wilbowes/EchoMuse/internal/client.BuildUnix=$(date +%s)\" \
              -o build/server \
              ./cmd/"

      - name: Verify binary
        run: |
          file device/build/server
          ls -lh device/build/server
          # Assert the binary carries THIS tag. The previous check grepped for
          # any version-shaped line (^v1.2.3$), which was wrong twice over: it
          # never confirmed the version was the one being released, and it
          # depended on string LAYOUT — Go concatenates string constants into
          # one blob, so the version reads as "@v2.9.11" with no line break
          # around it. Adding two unrelated constants shifted the blob and
          # broke the release of v2.9.11 with a perfectly good binary.
          if ! strings device/build/server | grep -qF "$GITHUB_REF_NAME"; then
            echo "::error::binary does not contain $GITHUB_REF_NAME — ldflags did not take"
            exit 1
          fi
          echo "binary carries $GITHUB_REF_NAME"

      # Provenance: a signed statement, logged in Sigstore's public ledger,
      # that THIS workflow at THIS commit built THIS binary. Check one with
      #   gh attestation verify server --repo wilbowes/EchoMuse
      # It does not stop a forged release by itself -- nothing checks it
      # before OTA yet -- but it makes one detectable after the fact.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: device/build/server

      # Release notes come from the ANNOTATED TAG MESSAGE.
      #
      # The dashboard shows these to whoever is deciding whether to push
      # firmware to a device they rely on, so they have to be written for that
      # person: what changed, what to expect, whether anything is required of
      # them. GitHub's generated notes are NOT added: they list every PR merged
      # in the repo between two v* tags, most of it controller work, with
      # "New Contributors" credits for changes that are not in the firmware.
      #
      # A lightweight tag has no annotation, and `%(contents)` then falls
      # through to the commit message — so it is refused rather than published.
      # `git tag -a --cleanup=verbatim`, always.
      - name: Release notes from the tag annotation
        run: |
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          if [ "$(git cat-file -t "$GITHUB_REF_NAME")" != tag ]; then
            echo "::error::$GITHUB_REF_NAME is a lightweight tag; it has no release notes. Re-tag with git tag -a."
            exit 1
          fi
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > /tmp/release-notes.md
          echo "--- notes that will be published ---"
          cat /tmp/release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: EchoMuse ${{ github.ref_name }}
          files: device/build/server
          body_path: /tmp/release-notes.md
          generate_release_notes: false
          prerelease: ${{ steps.channel.outputs.prerelease }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
