name: Controller Build (main)

# Builds and publishes the controller image from main, so that the release
# tag has something to PROMOTE rather than something to rebuild.
#
# Why this exists, in one sentence: the tag build used to be a rebuild, so
# the artifact users ran was never the artifact CI examined, and the
# vulnerability scan ran on an image that was already public.
#
# Three consequences that were all real:
#   - A failed release build left main pinning an image that would never
#     exist. controller/config.yaml names the image the Home Assistant
#     add-on pulls, and the release guard requires that pin to be bumped
#     BEFORE the tag — so a build failure after the bump is unrecoverable
#     without a retag.
#   - There was a ~10 minute window after tagging in which the add-on
#     pointed at a tag the registry did not have yet. Hit on 2.19.0.
#   - Scanning after publication is why those steps are report-only. Moving
#     the scan here does not by itself gate anything, but it puts the
#     finding in front of someone while fixing it is still cheap.
#
# The image is tagged by commit sha only. `latest` is deliberately NOT
# published here: docker-compose.deploy.yml pulls `latest`, so letting it
# follow main would silently put every compose user on unreleased code.

on:
  push:
    branches: [main]
    paths:
      - 'controller/**'
      - '.github/workflows/controller-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # EM_CONTROLLER_VERSION is baked into the image (ARG -> ENV in the
      # Dockerfile), so it has to be known at BUILD time — and at build time
      # the tag does not exist yet. controller/config.yaml's `version:` is
      # the answer: the release workflow refuses to build unless that field
      # equals the tag, so whatever is promoted carries the right version.
      #
      # The cost is that a main build BETWEEN releases bakes the version it
      # is heading towards rather than a distinct one. That only shows on a
      # sha- image pulled deliberately, which is not a supported way to run
      # the controller — those exist to be promoted.
      - name: Version from the add-on pin
        id: version
        run: |
          v="$(sed -n 's/^version:[[:space:]]*"\(.*\)"[[:space:]]*$/\1/p' controller/config.yaml)"
          if [ -z "$v" ]; then
            echo "::error::could not read version from controller/config.yaml"
            exit 1
          fi
          echo "version=v$v" >> "$GITHUB_OUTPUT"
          echo "sha=sha-$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
          echo "building v$v as sha-$(git rev-parse --short=7 HEAD)"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: controller
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            EM_CONTROLLER_VERSION=${{ steps.version.outputs.version }}
          tags: ghcr.io/${{ github.repository_owner }}/echomuse-controller:${{ steps.version.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # By digest, for the reason the release workflow documents: there is
      # no string to get wrong and no chance of scanning something other
      # than the artifact just built.
      #
      # NOT continue-on-error here, unlike the release workflow. Nothing has
      # been released at this point, so a broken scan step should be visible
      # on main where fixing it is free — that failure mode is exactly how
      # the SBOM step stayed broken through several releases.
      - name: Generate SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ghcr.io/${{ github.repository_owner }}/echomuse-controller@${{ steps.build.outputs.digest }}
          format: cyclonedx
          output: sbom-${{ steps.version.outputs.sha }}.cdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom-${{ steps.version.outputs.sha }}
          path: sbom-${{ steps.version.outputs.sha }}.cdx.json
          if-no-files-found: warn
          retention-days: 90

      # Report-only, deliberately. Gating a merge to main on a new CVE in a
      # base image would block unrelated work on someone else's disclosure
      # schedule. The scheduled scan is where policy belongs; this is here
      # so the finding arrives before release rather than after.
      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ghcr.io/${{ github.repository_owner }}/echomuse-controller@${{ steps.build.outputs.digest }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: '0'
