name: Controller Release (Docker image)

# Controller releases are tagged controller-vX.Y.Z (device firmware keeps
# plain vX.Y.Z — see release.yml). This builds the controller image and
# pushes it to GHCR as:
#   ghcr.io/<owner>/echomuse-controller:X.Y.Z
#   ghcr.io/<owner>/echomuse-controller:latest
#
# Deliberately no GitHub Release is created here: the controller's OTA
# system polls the repo's releases for device firmware (v* tags with a
# `server` asset), and controller releases must not appear there.
#
# The image is CPU-only (onnxruntime). GPU users build locally with
# --build-arg GPU=1 (see controller/docker-compose.yml).
#
# Built for linux/amd64 AND linux/arm64. A Raspberry Pi is a natural host for
# this project, and an amd64-only manifest meant docker-compose.deploy.yml
# could not work on one at all — building locally was the only route, and
# until #81 even that failed on the hard-coded x86-64 esbuild download.
# Every Python dependency resolves to a prebuilt aarch64 wheel on this base
# image, including speexdsp-ns and onnxruntime, so the arm64 build compiles
# nothing; it is emulated with QEMU, which costs time on the runner and
# nothing at run time.

# Two channels, one publish path — the image is identical, only the tag and
# the add-on directory whose pin is checked differ:
#   controller-v2.20.0        -> :2.20.0 + :latest   (GA,  controller/)
#   controller-ea-v2.20.0-ea.1 -> :2.20.0-ea.1        (EA, controller-ea/)
#
# EA never moves :latest. That tag is what docker-compose.deploy.yml pulls,
# so an EA build touching it would push a prerelease to every standalone
# container on the next `docker compose pull` — users who never opted into
# anything.
#
# The prefixes are deliberately distinct rather than one scheme with a
# suffix: em_api._fetch_controller_release lists tags with a PREFIX match on
# `controller-v`, so `controller-ea-v*` is excluded from the dashboard's
# update notice for free, and GA users are never advised to install a
# prerelease.
on:
  push:
    tags:
      - 'controller-v*'
      - 'controller-ea-v*'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Identify the channel
        id: channel
        run: |
          case "$GITHUB_REF_NAME" in
            controller-ea-v*)
              echo "channel=ea"                                    >> "$GITHUB_OUTPUT"
              echo "addon_dir=controller-ea"                       >> "$GITHUB_OUTPUT"
              echo "image_tag=${GITHUB_REF_NAME#controller-ea-v}"  >> "$GITHUB_OUTPUT"
              echo "version=${GITHUB_REF_NAME#controller-ea-}"     >> "$GITHUB_OUTPUT"
              echo "latest=false"                                  >> "$GITHUB_OUTPUT"
              ;;
            controller-v*)
              echo "channel=ga"                                    >> "$GITHUB_OUTPUT"
              echo "addon_dir=controller"                          >> "$GITHUB_OUTPUT"
              echo "image_tag=${GITHUB_REF_NAME#controller-v}"     >> "$GITHUB_OUTPUT"
              echo "version=${GITHUB_REF_NAME#controller-}"        >> "$GITHUB_OUTPUT"
              echo "latest=true"                                   >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::$GITHUB_REF_NAME matches no known channel"
              exit 1
              ;;
          esac

      # The Home Assistant add-on pulls a PUBLISHED image, pinned by
      # its config.yaml's `version:` — so that file names an image
      # that has to exist and has to contain the add-on code. Getting it
      # wrong is not caught by any test and does not fail the release; it
      # fails on the user's Home Assistant, by silently running whichever
      # older controller that tag points at. That happened on the first
      # install: config.yaml pinned 2.18.0, an image built before the
      # add-on existed, so Supervisor started a controller with no ingress
      # support — the dashboard answered the LAN with no gate, and the
      # panel's absolute /api paths hit Home Assistant instead of the
      # add-on. Both symptoms, one stale pin.
      #
      # Checked here rather than in the test suite because this is the only
      # moment the two can be compared: the tag being released IS the image
      # tag, and CI on a branch has neither.
      - name: Add-on version matches the tag
        run: |
          dir="${{ steps.channel.outputs.addon_dir }}"
          want="${{ steps.channel.outputs.image_tag }}"
          got="$(sed -n 's/^version:[[:space:]]*"\(.*\)"[[:space:]]*$/\1/p' "$dir/config.yaml")"
          if [ "$want" != "$got" ]; then
            echo "::error::$dir/config.yaml pins version '$got' but this release is '$want'."
            echo "The add-on would pull ghcr.io/.../echomuse-controller:$got — not what is being released here."
            exit 1
          fi
          echo "$dir pins $got, matching the tag"

      # No QEMU: nothing here EXECUTES. The application layers were
      # cross-built under emulation by the main build; this workflow only adds
      # a layer that sets an environment variable, which needs no RUN and so
      # no emulation for either architecture.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Locate the image built on main
        id: version
        run: |
          echo "sha=sha-$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      # Which tags this release writes. Taken from the CHANNEL step, not from
      # the ref directly: EA must never move :latest — that is what
      # docker-compose.deploy.yml pulls, so an EA release touching it would put
      # a prerelease on every standalone container at the next `compose pull`.
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/echomuse-controller
          tags: |
            type=raw,value=${{ steps.channel.outputs.image_tag }}
            type=raw,value=latest,enable=${{ steps.channel.outputs.latest }}

      # PROMOTE, never rebuild.
      #
      # Every application layer released here is the one controller-build.yml
      # published from main and scanned. A rebuild could not promise that: it
      # resolves floating base layers and unpinned wheels again, so what
      # shipped was never quite what CI examined. (One layer IS added at
      # release — see the version stamp below — and it contains no files.)
      #
      # It also removes the window this replaced. Building on the tag left a
      # gap in which controller/config.yaml pinned an image the registry did
      # not have, and a Home Assistant install in that window failed with
      # "unknown error": 2.19.0, and again on 2.20.1 where it measured 13m24s
      # between the pin landing on main and the image existing. Reusing the
      # published layers takes seconds.
      - name: Check the image exists for this commit
        run: |
          src="ghcr.io/${{ github.repository_owner }}/echomuse-controller:${{ steps.version.outputs.sha }}"
          if ! docker buildx imagetools inspect "$src" >/dev/null 2>&1; then
            echo "::error::No image published for this commit ($src)."
            echo "The main build has not run or did not finish for the commit being tagged."
            echo "Run the 'Controller Build (main)' workflow on this commit, wait for it, then retag."
            exit 1
          fi
          echo "found $src"

      # NOT imagetools create, and not a rebuild either.
      #
      # imagetools would be the obvious promote — it writes a manifest
      # reference and takes seconds — but it cannot change an environment
      # variable, and EM_CONTROLLER_VERSION is baked at build time. The main
      # build has no tag to bake, so it uses controller/config.yaml's version,
      # which is the GA pin. Promoting that same image as an EA release would
      # ship a controller reporting the GA version: the dashboard header, the
      # ESPHome project version and every support bundle would name the wrong
      # build, and the update notice would compare against it.
      #
      # So the release adds one layer that sets the real version. Every
      # application layer is still exactly what main built and scanned; only
      # the environment differs, which is the one thing that legitimately
      # cannot be known before the tag exists.
      - name: Stamp the version and push the release tags
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .github/version-stamp.Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            BASE=ghcr.io/${{ github.repository_owner }}/echomuse-controller:${{ steps.version.outputs.sha }}
            EM_CONTROLLER_VERSION=${{ steps.channel.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # ── Supply chain ────────────────────────────────────────────────────
      #
      # The image is what users actually run, and it is the only place the
      # full dependency set exists: requirements.txt leaves four packages
      # unpinned, openwakeword is installed with --no-deps, and the Debian
      # base contributes ffmpeg and curl. So the SBOM is generated from the
      # built image, never from requirements.txt.
      #
      # amd64 only. The two architectures install the same wheels from the
      # same base image, and scanning the arm64 variant under QEMU costs
      # runner minutes to restate the answer. Addressing the index by digest
      # keeps that: trivy resolves it to the runner's own platform.
      #
      # BY DIGEST, never by a reconstructed tag. These steps asked for
      # :v2.18.0 while metadata-action had published :2.18.0 — the version
      # output carries the v because it is also EM_CONTROLLER_VERSION for the
      # dashboard header, while `type=match,pattern=controller-v(.*)` captures
      # the group after it. The two disagreed from the day the file was
      # written and nothing noticed, because the steps had never run. The
      # digest is what build-push-action actually pushed, so there is no
      # string to get wrong and no chance of scanning something other than
      # the artifact being released.
      #
      # continue-on-error for the same reason the scan below is exit-code 0:
      # the image is already public by the time this runs, so failing here
      # marks a release red without unpublishing anything. It did exactly
      # that on controller-v2.18.0, and took the scan down with it.
      - name: Generate SBOM
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ghcr.io/${{ github.repository_owner }}/echomuse-controller@${{ steps.build.outputs.digest }}
          format: cyclonedx
          output: sbom-controller-${{ steps.channel.outputs.version }}.cdx.json

      # Attached to the workflow run rather than to a Release, because
      # controller tags deliberately create no GitHub Release — the OTA
      # poller reads the releases list looking for device firmware, and a
      # controller release appearing there would be offered to devices.
      # Retention is long: the useful question is "what was in the version I
      # am running", which is asked months after the release, not days.
      #
      # if-no-files-found: warn because the step above may now have failed
      # without stopping the job — a release missing its SBOM is a gap in the
      # record, not a reason to report the release itself as broken.
      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom-controller-${{ steps.channel.outputs.version }}
          path: sbom-controller-${{ steps.channel.outputs.version }}.cdx.json
          if-no-files-found: warn
          retention-days: 365

      # Report-only, and it must stay that way in THIS workflow: the image
      # has already been pushed by the time this runs, so failing here would
      # mark a release red without unpublishing anything — the worst of both
      # (a red tick and a live image). Gating belongs before the push or in
      # the scheduled scan, not here.
      #
      # exit-code 0 covers a step that RUNS and finds something. It cannot
      # cover a step that never starts, so continue-on-error covers the rest:
      # an unresolvable action reference took this workflow down twice before
      # the build on controller-v2.18.0, and a failed SBOM skipped this step
      # entirely on the third attempt.
      - name: Scan image for vulnerabilities
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ghcr.io/${{ github.repository_owner }}/echomuse-controller@${{ steps.build.outputs.digest }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
