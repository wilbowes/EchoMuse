name: emOS Release (init binary)

# emOS has its OWN tag namespace, and that is deliberate rather than tidiness.
#
# `emos/build.sh` stamps the image with `git describe --match 'emos-v*'`:
# without the match it picks up the nearest tag of any kind and stamps an emOS
# image with a controller release number, which is worse than "unknown"
# because it looks plausible. The tags have to exist for that to resolve to
# anything.
#
# It also keeps this out of the firmware OTA's way. `em_api._fetch_latest_
# release` selects the newest release whose tag `startswith("v")` and which
# carries a `server` asset — `emos-v0.1` matches neither test, so publishing
# here can never be mistaken for a firmware release. That is the same
# mechanism that keeps `controller-v*` out of it.
#
# WHAT IS PUBLISHED IS THE INIT, NOT AN IMAGE. A bootable emOS image contains
# the device's own kernel and device trees, so we cannot ship one without
# redistributing Amazon's code — the image is assembled on the user's side,
# from the boot partition they read off their own device. The init is ours
# and is the only part that needs distributing.
#
# TWO of them, because the init must match the device's KERNEL: `init` is
# aarch64 for FireOS 5 and `init32` is armv7a for FireOS 6. See the compile
# steps. Nothing else published here is per-architecture.
#
# Alongside them: emOS's own `wpa_supplicant`, `wpa_cli`, `em-wifi` and
# `busybox`. Ours, not Amazon's — hostap is BSD, libnl-tiny LGPL, busybox
# GPLv2, em-wifi is our source — so they are as distributable as the init. A
# FireOS 6 image NEEDS them: Amazon's supplicant aborts under emOS before
# main() (it opens /dev/binder), and a FireOS 6 /system ships toybox and no
# busybox at all, so there is no udhcpc to get an address with.
#
# busybox is GPLv2, the only licence here that obliges us to distribute SOURCE,
# and that obligation is met by ASSETS rather than by wording in the notes.
# Every release publishes `busybox-<ver>.tar.bz2` (the unmodified upstream
# tarball this binary was built from, verified against its pin) and
# `busybox-LICENSE`, beside the binary. A link to busybox.net would not do:
# §3(a) wants the source to accompany the binary, and a link makes our
# compliance depend on a third party not reorganising their server.
#
# We patch nothing — the build only configures — so the tarball plus
# emos/tools/build-busybox.sh (the "scripts used to control compilation" that
# §3 also asks for, public in this repo) is the complete corresponding source.
# The compliance step below fails the release if either asset is missing.
#
# All of that ships as ONE bundle with a manifest of sha256s, so a partially
# published release cannot hand a build a mismatched set of parts. The loose
# `init` is published beside it for compatibility only — see the release step.
#
# Every asset here is byte-identical build to build: the toolchain is a
# digest-pinned image, the init is repo source, and the wpa sources are pinned by
# sha256 and by commit. That is what makes a release something a device can be
# troubleshot against rather than a moving target.

on:
  push:
    tags:
      - 'emos-v*'

env:
  # Pinned by DIGEST for the same reason device/compiler/Dockerfile pins its
  # base: `:3.21` is a tag somebody else can move, and a toolchain that changes
  # with no PR first shows up as a binary that does not run on the hardware.
  # This is alpine:3.21's manifest list; --platform picks the armv7 image out
  # of it. Alpine because it is a distribution's own gcc and musl rather than
  # one maintainer's convenience image.
  ALPINE_ARMV7_DIGEST: >-
    sha256:48b0309ca019d89d40f670aa1bc06e426dc0931948452e8491e3d65087abc07d

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The same pinned image the firmware is built from, for the reason
      # device/CLAUDE.md gives: it carries the NDK against a 2015 platform we
      # cannot upgrade, and a floating toolchain would change what boots under
      # us with no PR.
      - name: Build compiler image
        run: docker build -t echomuse-compiler device/compiler/

      # BOTH ARCHITECTURES — the init is the only thing here needing two, since
      # it must match the KERNEL: 64-bit on FireOS 5, 32-bit on FireOS 6 (the
      # only FireOS amonet v2.0.0 boots). Getting it wrong cost five flashed
      # images that never executed. The firmware stays armv7a for both.
      #
      # `init` keeps its name: _fetch_latest_emos_release selects on it by exact
      # name, so renaming it strands every fielded controller.
      #
      # -static is what has to keep working. There is no dynamic loader at
      # PID 1 time, and three boots with a busybox script init produced no
      # output whatsoever, which is indistinguishable from a kernel that never
      # started.
      # No version is compiled INTO either: it describes the image rather
      # than the binary, and it reaches the device through /etc/os-release,
      # which whatever assembles the image writes. The tag is the version, and
      # it travels with the asset.
      - name: Compile init (aarch64, for FireOS 5)
        run: |
          mkdir -p emos/build
          docker run --rm -v "${{ github.workspace }}/emos":/emos -w /emos \
            echomuse-compiler bash -lc \
            "/opt/android/ndk/21.4.7075529/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang \
               -static -O2 -Wall -o build/init init/init.c"

      - name: Compile init32 (armv7a, for FireOS 6)
        run: |
          docker run --rm -v "${{ github.workspace }}/emos":/emos -w /emos \
            echomuse-compiler bash -lc \
            "/opt/android/ndk/21.4.7075529/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi21-clang \
               -static -O2 -Wall -o build/init32 init/init.c"

      - name: Verify both are static, and are the architecture each claims
        # Each is silent when wrong and fatal on the device, and CI only checks
        # a branch tip — this checks what is published. They are also compared
        # against EACH OTHER: two compiles differing only in a triple is where a
        # copy-paste publishes one binary twice and each grep still passes.
        run: |
          file emos/build/init emos/build/init32
          ls -lh emos/build/init emos/build/init32
          file emos/build/init | grep -q "ARM aarch64" || {
            echo "::error::init is not an aarch64 binary"; exit 1; }
          file emos/build/init32 | grep -q "32-bit LSB executable, ARM" || {
            echo "::error::init32 is not a 32-bit ARM binary"; exit 1; }
          for f in init init32; do
            file "emos/build/$f" | grep -q "statically linked" || {
              echo "::error::$f is not statically linked"; exit 1; }
          done
          if cmp -s emos/build/init emos/build/init32; then
            echo "::error::init and init32 are identical — one triple built both"
            exit 1
          fi

      # emOS's own WiFi userspace. One build for both kernels, unlike the init:
      # these are ordinary processes and a 64-bit kernel runs 32-bit binaries.
      #
      # Built here rather than committed so what ships traces to sources — hostap
      # pinned by sha256, libnl-tiny by commit, same digest-pinned toolchain as
      # the init. Measured byte-identical across build directories.
      - name: Build wpa_supplicant and wpa_cli (armv7a, static)
        run: |
          mkdir -p emos/build/wpa
          docker run --rm -v "${{ github.workspace }}/emos":/emos \
            -v "${{ github.workspace }}/emos/build/wpa":/out -w /tmp \
            echomuse-compiler bash -lc '/emos/tools/build-wpa-supplicant.sh /out'

      - name: Verify the wpa tools are static 32-bit ARM
        # emOS execs these directly with no dynamic loader, so a dynamically
        # linked one reaches the network stage and stops there silently.
        run: |
          file emos/build/wpa/wpa_supplicant emos/build/wpa/wpa_cli
          for f in wpa_supplicant wpa_cli; do
            file "emos/build/wpa/$f" | grep -q "32-bit LSB executable, ARM" || {
              echo "::error::$f is not a 32-bit ARM binary"; exit 1; }
            file "emos/build/wpa/$f" | grep -q "statically linked" || {
              echo "::error::$f is not statically linked"; exit 1; }
          done
          # em-wifi is repo source, not a build product, but it is published
          # beside them because the controller image cannot reach emos/ — the
          # same constraint that put a second copy of the packer in controller/.
          cp emos/device/em-wifi emos/build/wpa/em-wifi
          head -1 emos/build/wpa/em-wifi | grep -q '^#!' || {
            echo "::error::em-wifi has no interpreter line"; exit 1; }
          sh -n emos/build/wpa/em-wifi || {
            echo "::error::em-wifi is not valid shell"; exit 1; }

      # busybox is built on ALPINE, not the NDK, and that is a deliberate
      # exception to the pinned-toolchain rule the rest of this file follows.
      #
      # The binary is static, and a static binary needs only the kernel's
      # syscall ABI — not bionic, not Android's linker. busybox does not target
      # bionic: defconfig against the NDK needs eight source patches and twenty
      # applets disabled, and clang 9 segfaults on hush.c. Against musl the same
      # defconfig builds with none of that. Measured 2026-09-14.
      #
      # qemu + an armv7 Alpine image makes it a NATIVE build, so there is no
      # cross-compilation surface to get wrong. It costs ~8 minutes.
      - name: Set up qemu (for the armv7 busybox build)
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm

      - name: Build busybox (armv7, static)
        run: |
          mkdir -p emos/build/bb
          docker run --rm --platform linux/arm/v7 \
            -v "${{ github.workspace }}/emos":/emos \
            -v "${{ github.workspace }}/emos/build/bb":/out -w /tmp \
            alpine@${{ env.ALPINE_ARMV7_DIGEST }} \
            sh /emos/tools/build-busybox.sh /out

      - name: Verify busybox is static 32-bit ARM
        # Same check as the wpa tools, for the same reason: emOS execs this with
        # no dynamic loader, so a dynamically linked one reaches the network
        # stage and stops there silently.
        run: |
          file emos/build/bb/busybox
          file emos/build/bb/busybox | grep -q "32-bit LSB executable, ARM" || {
            echo "::error::busybox is not a 32-bit ARM executable"; exit 1; }
          file emos/build/bb/busybox | grep -q "statically linked" || {
            echo "::error::busybox is not statically linked"; exit 1; }

      - name: Verify the GPL-2.0 obligation is actually satisfiable
        # This is a RELEASE gate, not a build detail. If the binary ships and
        # the source does not, we have distributed GPL-2.0 object code with no
        # accompanying source — and nothing else in this pipeline would notice,
        # because the image builds and the device boots either way.
        run: |
          BB_VER=$(sed -n 's/^BB_VER=//p' emos/tools/build-busybox.sh)
          BB_SHA512=$(sed -n 's/^BB_SHA512=//p' emos/tools/build-busybox.sh)
          src=emos/build/bb/busybox-$BB_VER.tar.bz2
          for f in "$src" emos/build/bb/busybox-LICENSE; do
            [ -s "$f" ] || {
              echo "::error::$f is missing — the busybox binary cannot be"
              echo "::error::published without its corresponding source"
              exit 1; }
          done
          # The published source must be the source we built from, not merely
          # a tarball with the right name.
          echo "$BB_SHA512  $src" | sha512sum -c - || {
            echo "::error::the published busybox source does not match the pin"
            exit 1; }
          # That the binary was built from UNMODIFIED upstream — which is what
          # makes the tarball sufficient on its own — is proven in the build
          # itself: build-busybox.sh diffs the built tree against this tarball
          # and refuses if any upstream file was changed. Checking it here with
          # a keyword grep would be theatre, since the supplicant build beside
          # it patches sources with inline python that no grep would catch.
          echo "GPL-2.0: source + licence present, source matches the pin"

      # ONE bundle, with a manifest of sha256s. Five assets fetched in sequence
      # could each fail on their own and hand a build a mismatched set; the
      # manifest is also the first digest in this path the RELEASE computed.
      #
      # The format lives in controller/em_emos_build.py and is imported from
      # there, so writer and reader cannot drift. The script reads its output
      # back through the real reader, so a release cannot publish a bundle its
      # own consumer would refuse.
      - name: Bundle the payload
        run: |
          python3 emos/tools/make-payload-bundle.py "$GITHUB_REF_NAME" \
            emos/build/emos-payload.zip \
            emos/build/init emos/build/init32 \
            emos/build/wpa/wpa_supplicant emos/build/wpa/wpa_cli \
            emos/build/wpa/em-wifi emos/build/bb/busybox

      # The off-target checks, against the exact source being published. All
      # four of them: each drives a parser or an invariant whose failure is
      # silent on hardware, which is the criterion in CLAUDE.md for having one.
      - name: Off-target checks
        run: |
          cc -O2 -Wall -o /tmp/ringsim emos/init/ringsim.c -lm
          /tmp/ringsim --check
          cc -O2 -o /tmp/pwcheck emos/init/pwcheck.c
          /tmp/pwcheck
          cc -O2 -o /tmp/tmoutcheck emos/init/tmoutcheck.c
          /tmp/tmoutcheck
          cc -O2 -o /tmp/wpacheck emos/init/wpacheck.c
          /tmp/wpacheck
          cc -O2 -o /tmp/cmdlinecheck emos/init/cmdlinecheck.c
          /tmp/cmdlinecheck
          cc -O2 -o /tmp/serialcheck emos/init/serialcheck.c
          /tmp/serialcheck

      # Same rule as the firmware release: the notes come from the ANNOTATED
      # tag, because whoever reads them is deciding whether to reflash a boot
      # partition. `git tag -a`, always — and `--cleanup=verbatim` if they use
      # Markdown headings, or every line starting with # is deleted whole.
      - name: Release notes from the tag annotation
        run: |
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          if [ "$(git cat-file -t "$GITHUB_REF_NAME")" != tag ]; then
            echo "::error::$GITHUB_REF_NAME is a lightweight tag; it has no release notes. Re-tag with git tag -a."
            exit 1
          fi
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > /tmp/emos-notes.md
          echo "--- notes that will be published ---"
          cat /tmp/emos-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: emOS ${{ github.ref_name }}
          # The bundle, plus the loose `init` — and that one is NOT redundant.
          # `_fetch_latest_emos_release` selects a release by matching that exact
          # asset name, so a controller already in the field looks for it;
          # dropping it would leave every fielded controller seeing no usable
          # emOS release, which breaks FireOS 5 provisioning too. Everything else
          # travels inside the bundle rather than being published twice.
          files: |
            emos/build/init
            emos/build/emos-payload.zip
            emos/build/bb/busybox-*.tar.bz2
            emos/build/bb/busybox-LICENSE
          body_path: /tmp/emos-notes.md
          # No generated list. GitHub's is every PR merged anywhere in the repo
          # between two emos-v* tags — controller, docs, firmware — with "New
          # Contributors" credits for work that is not in emOS (emos-v0.7
          # credited a wake word cache fix). The tag annotation is the notes.
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
