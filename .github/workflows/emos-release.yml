name: emOS Release (init binary)

# emOS has its OWN tag namespace, and that is deliberate rather than tidiness.
#
# `emos/build.sh` stamps the image with `git describe --match 'emos-v*'`:
# without the match it picks up the nearest tag of any kind and stamps an emOS
# image with a controller release number, which is worse than "unknown"
# because it looks plausible. The tags have to exist for that to resolve to
# anything.
#
# It also keeps this out of the firmware OTA's way. `em_api._fetch_latest_
# release` selects the newest release whose tag `startswith("v")` and which
# carries a `server` asset — `emos-v0.1` matches neither test, so publishing
# here can never be mistaken for a firmware release. That is the same
# mechanism that keeps `controller-v*` out of it.
#
# WHAT IS PUBLISHED IS THE INIT, NOT AN IMAGE. A bootable emOS image contains
# the device's own kernel and device trees, so we cannot ship one without
# redistributing Amazon's code — the image is assembled on the user's side,
# from the boot partition they read off their own device. The init is ours
# and is the only part that needs distributing.
#
# TWO of them, because the init must match the device's KERNEL: `init` is
# aarch64 for FireOS 5 and `init32` is armv7a for FireOS 6. See the compile
# steps. Nothing else published here is per-architecture.
#
# Alongside them: emOS's own `wpa_supplicant`, `wpa_cli` and `em-wifi`. Ours,
# not Amazon's — hostap is BSD, libnl-tiny LGPL, em-wifi is our source — so they
# are as distributable as the init. A FireOS 6 image NEEDS them, because Amazon's
# supplicant aborts under emOS before main() (it opens /dev/binder).
#
# Every asset here is byte-identical build to build: the toolchain is a
# digest-pinned image, the init is repo source, and the wpa sources are pinned by
# sha256 and by commit. That is what makes a release something a device can be
# troubleshot against rather than a moving target.

on:
  push:
    tags:
      - 'emos-v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The same pinned image the firmware is built from, for the reason
      # device/CLAUDE.md gives: it carries the NDK against a 2015 platform we
      # cannot upgrade, and a floating toolchain would change what boots under
      # us with no PR.
      - name: Build compiler image
        run: docker build -t echomuse-compiler device/compiler/

      # BOTH ARCHITECTURES, and the init is the only thing here needing two.
      #
      # The init must match the device's KERNEL: FireOS 5 boots a 64-bit one,
      # FireOS 6 — the only FireOS amonet-biscuit v2.0.0 boots — a 32-bit build
      # of the same 3.18.19 source. Getting it wrong is the fact that cost five
      # flashed images of a 32-bit kernel that never executed an instruction.
      # The firmware beside it stays armv7a for both, because it targets the
      # Android userspace, which is 32-bit either way.
      #
      # `init` keeps its name rather than becoming `init-arm64`: it is what every
      # published release has carried and what `_fetch_latest_emos_release`
      # selects on by EXACT name, so renaming it strands every controller
      # already in the field looking for it.
      #
      # -static is what has to keep working. There is no dynamic loader at
      # PID 1 time, and three boots with a busybox script init produced no
      # output whatsoever, which is indistinguishable from a kernel that never
      # started.
      # No version is compiled INTO either: it describes the image rather
      # than the binary, and it reaches the device through /etc/os-release,
      # which whatever assembles the image writes. The tag is the version, and
      # it travels with the asset.
      - name: Compile init (aarch64, for FireOS 5)
        run: |
          mkdir -p emos/build
          docker run --rm -v "${{ github.workspace }}/emos":/emos -w /emos \
            echomuse-compiler bash -lc \
            "/opt/android/ndk/21.4.7075529/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang \
               -static -O2 -Wall -o build/init init/init.c"

      - name: Compile init32 (armv7a, for FireOS 6)
        run: |
          docker run --rm -v "${{ github.workspace }}/emos":/emos -w /emos \
            echomuse-compiler bash -lc \
            "/opt/android/ndk/21.4.7075529/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi21-clang \
               -static -O2 -Wall -o build/init32 init/init.c"

      - name: Verify both are static, and are the architecture each claims
        # Every one of these is silent when wrong and fatal on the device, and
        # this is the last point before the artifacts are something people
        # flash. Checked here as well as in CI because CI checks the tip of a
        # branch and this checks the thing being published.
        #
        # They are also compared against EACH OTHER. Two compiles differing only
        # in a toolchain triple is exactly the shape where a copy-paste publishes
        # one binary under both names, and each grep would still pass.
        run: |
          file emos/build/init emos/build/init32
          ls -lh emos/build/init emos/build/init32
          file emos/build/init | grep -q "ARM aarch64" || {
            echo "::error::init is not an aarch64 binary"; exit 1; }
          file emos/build/init32 | grep -q "32-bit LSB executable, ARM" || {
            echo "::error::init32 is not a 32-bit ARM binary"; exit 1; }
          for f in init init32; do
            file "emos/build/$f" | grep -q "statically linked" || {
              echo "::error::$f is not statically linked"; exit 1; }
          done
          if cmp -s emos/build/init emos/build/init32; then
            echo "::error::init and init32 are identical — one triple built both"
            exit 1
          fi

      # emOS's own WiFi userspace. ONE build for both kernels, unlike the init:
      # these run as ordinary processes, and a 64-bit kernel runs 32-bit binaries
      # — it has to, since the whole Android userspace on biscuit is 32-bit on
      # top of FireOS 5's 64-bit kernel.
      #
      # Built here rather than committed, so what ships can be traced to sources:
      # the script pins hostap by sha256 and libnl-tiny by commit, and the
      # toolchain is the same digest-pinned image the init uses. Measured
      # byte-identical across build directories, which is what makes a published
      # artifact worth anything when somebody is troubleshooting a device against
      # a release.
      - name: Build wpa_supplicant and wpa_cli (armv7a, static)
        run: |
          mkdir -p emos/build/wpa
          docker run --rm -v "${{ github.workspace }}/emos":/emos \
            -v "${{ github.workspace }}/emos/build/wpa":/out -w /tmp \
            echomuse-compiler bash -lc '/emos/tools/build-wpa-supplicant.sh /out'

      - name: Verify the wpa tools are static 32-bit ARM
        # Same reasoning as the inits: emOS execs these directly with no dynamic
        # loader available, so a dynamically linked one is a boot that reaches the
        # network stage and stops there with nothing said.
        run: |
          file emos/build/wpa/wpa_supplicant emos/build/wpa/wpa_cli
          for f in wpa_supplicant wpa_cli; do
            file "emos/build/wpa/$f" | grep -q "32-bit LSB executable, ARM" || {
              echo "::error::$f is not a 32-bit ARM binary"; exit 1; }
            file "emos/build/wpa/$f" | grep -q "statically linked" || {
              echo "::error::$f is not statically linked"; exit 1; }
          done
          # em-wifi is repo source, not a build product, but it is published
          # beside them because the controller image cannot reach emos/ — the
          # same constraint that put a second copy of the packer in controller/.
          cp emos/device/em-wifi emos/build/wpa/em-wifi
          head -1 emos/build/wpa/em-wifi | grep -q '^#!' || {
            echo "::error::em-wifi has no interpreter line"; exit 1; }
          sh -n emos/build/wpa/em-wifi || {
            echo "::error::em-wifi is not valid shell"; exit 1; }

      # The off-target checks, against the exact source being published. All
      # four of them: each drives a parser or an invariant whose failure is
      # silent on hardware, which is the criterion in CLAUDE.md for having one.
      - name: Off-target checks
        run: |
          cc -O2 -Wall -o /tmp/ringsim emos/init/ringsim.c -lm
          /tmp/ringsim --check
          cc -O2 -o /tmp/pwcheck emos/init/pwcheck.c
          /tmp/pwcheck
          cc -O2 -o /tmp/tmoutcheck emos/init/tmoutcheck.c
          /tmp/tmoutcheck
          cc -O2 -o /tmp/wpacheck emos/init/wpacheck.c
          /tmp/wpacheck

      # Same rule as the firmware release: the notes come from the ANNOTATED
      # tag, because whoever reads them is deciding whether to reflash a boot
      # partition. `git tag -a`, always — and `--cleanup=verbatim` if they use
      # Markdown headings, or every line starting with # is deleted whole.
      - name: Release notes from the tag annotation
        run: |
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > /tmp/emos-notes.md
          echo "--- notes that will be published ---"
          cat /tmp/emos-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: emOS ${{ github.ref_name }}
          files: |
            emos/build/init
            emos/build/init32
            emos/build/wpa/wpa_supplicant
            emos/build/wpa/wpa_cli
            emos/build/wpa/em-wifi
          body_path: /tmp/emos-notes.md
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
