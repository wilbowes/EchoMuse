<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wake Word Forge · EchoMuse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script>
  /* Applied before first paint: set from the script at the end of the body,
     a dark-mode user would see a full flash of the light page on every load.
     Same key as the dashboard ('em-theme'), so one pick covers both. */
  (function () {
    try {
      var saved = localStorage.getItem('em-theme');
      var theme = saved || (window.matchMedia &&
        window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    } catch (e) {
      document.documentElement.setAttribute('data-theme', 'light');
    }
  })();
</script>
<style>
  /* Tokens are the DASHBOARD's (controller/static/dashboard.html), copied
     rather than invented, so the two surfaces cannot drift into two slightly
     different warm greys. Those values meet WCAG 2.2 AA in both themes and
     controller/tests/test_contrast.py proves it; tests/test_forge_ui.py holds
     these equal to them. The layout is the provisioning wizard's: a step
     rail, a main panel with a footer of actions, the log as a flyout. */
  :root, :root[data-theme="light"] {
    --raised:#e8e4de; --card:#e0dcd4; --surface:#d8d4cc; --sunken:#d0ccc4; --bg:#ccc8c0;
    --border:#b8b4ac; --border-soft:#c0bdb6; --border-hard:#b0aca4; --field-line:#777268;
    --text:#1e1c18; --text2:#4a4844; --muted:#575450; --faint:#767269;
    --ok:#285e3f; --warn:#854212; --error:#973020; --error-deep:#782020; --on-error:#f0d8d8;
    --accent:#3e5675; --accent-hi:#4d698c; --accent-deep:#304860; --accent-lit:#8ab0d0;
    --accent-tint:#dde8f4; --accent-line:#ccd8ec;
    --lcd-bg:#1e2219; --lcd-green:#9aba80; --lcd-amber:#c8a141; --lcd-dim:#95ae86;
    --lcd-line:#1a1c18; --lcd-face:#2a2e28; --lcd-faint:#3a4a30;
    --shadow-card:0 4px 16px rgba(0,0,0,0.12), 0 1px 0 rgba(255,255,255,0.7) inset;
    --shadow-inset:inset 0 2px 4px rgba(0,0,0,0.5);
    --sheen:rgba(255,255,255,0.4); --hairline:rgba(0,0,0,0.06); --track:rgba(0,0,0,0.10);
  }
  :root[data-theme="dark"] {
    --raised:#2b3024; --card:#22261c; --surface:#1b1e16; --sunken:#171a12; --bg:#14160f;
    --border:#343a2b; --border-soft:#2c3124; --border-hard:#414736; --field-line:#7f8b69;
    --text:#ddd9d1; --text2:#b2ada4; --muted:#aaa8a4; --faint:#8a867f;
    --ok:#82b489; --warn:#d79b56; --error:#da978a; --error-deep:#c16a5a; --on-error:#2a1512;
    --accent:#8caac9; --accent-hi:#8fb0d0; --accent-deep:#4a6a8c; --accent-lit:#a8c8e4;
    --accent-tint:#1f2c3a; --accent-line:#2f4054;
    --lcd-bg:#12150e; --lcd-green:#9aba80; --lcd-amber:#c8a141; --lcd-dim:#95ae86;
    --lcd-line:#0c0e08; --lcd-face:#1e2219; --lcd-faint:#3a4a30;
    --shadow-card:0 4px 16px rgba(0,0,0,0.45), 0 1px 0 rgba(255,255,255,0.05) inset;
    --shadow-inset:inset 0 2px 4px rgba(0,0,0,0.6);
    --sheen:rgba(255,255,255,0.05); --hairline:rgba(255,255,255,0.07); --track:rgba(0,0,0,0.35);
  }
  /* Dark in both themes, so text on it takes the dark theme's values. */
  .em-console { --text:#ddd9d1; --text2:#b2ada4; --muted:#aaa8a4; --faint:#8a867f;
    --ok:#82b489; --warn:#d79b56; --error:#da978a; --accent:#8caac9; }

  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { background: var(--bg); color: var(--text); font: 400 14px/1.5 'DM Sans', system-ui, sans-serif;
         padding: 16px; }
  .mono { font-family: 'DM Mono', ui-monospace, monospace; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  h2, h3, p { margin: 0; }
  a { color: var(--accent); text-underline-offset: 2px; }

  /* Buttons: the dashboard's .em-pill and its variants. */
  .em-pill { display: inline-flex; align-items: center; justify-content: center; gap: 7px;
    min-height: 32px; background: linear-gradient(180deg, var(--surface), var(--border-soft));
    color: var(--text); border: 1px solid var(--faint); border-radius: 20px;
    font: 500 12px 'DM Sans', sans-serif; padding: 7px 20px; cursor: pointer; white-space: nowrap;
    text-decoration: none; transition: all 0.1s;
    box-shadow: 0 1px 0 rgba(255,255,255,0.15) inset, 0 2px 4px rgba(0,0,0,0.2); }
  .em-pill--small { font-size: 12px; padding: 5px 14px; min-height: 28px; }
  .em-pill--big { font-size: 14px; font-weight: 600; padding: 10px 26px; }
  .em-pill--accent { background: linear-gradient(180deg, var(--accent-hi), var(--accent));
    color: var(--accent-tint); border-color: var(--accent-deep); }
  .em-pill--danger { background: linear-gradient(180deg, var(--error), var(--error-deep));
    color: var(--on-error); border-color: var(--error-deep); }
  .em-pill:active:not(:disabled) { transform: translateY(1px); }
  .em-pill:disabled { background: linear-gradient(180deg, var(--sunken), var(--border));
    color: var(--muted); border-color: var(--border-hard); cursor: not-allowed; box-shadow: none; }
  .link { background: none; border: 0; padding: 2px 0; font: inherit; color: var(--accent); cursor: pointer;
    text-decoration: underline; text-underline-offset: 2px; }
  .link.quiet { color: var(--muted); }
  .em-label { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.15em; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ── Frame: rail + main, the wizard's shape at full page height ─────── */
  .app { max-width: 1120px; margin: 0 auto; height: calc(100dvh - 32px); min-height: 560px;
    display: grid; grid-template-columns: 240px minmax(0, 1fr); grid-template-rows: minmax(0, 1fr);
    background: linear-gradient(170deg, var(--raised), var(--card)); border: 1px solid var(--border);
    border-radius: 14px; box-shadow: var(--shadow-card); overflow: hidden; position: relative; }
  .app > * { min-width: 0; }

  .rail { border-right: 1px solid var(--border); display: flex;
    flex-direction: column; min-height: 0; overflow-y: auto; padding: 18px 0 12px; }
  .brand { padding: 0 18px 16px; display: flex; align-items: flex-start; gap: 8px; }
  .brand h1 { font-size: 15px; font-weight: 600; margin: 0; line-height: 1.3; }
  .brand h1 span { display: block; font-family: 'DM Mono', monospace; font-size: 10px; font-weight: 400;
    color: var(--muted); letter-spacing: .06em; margin-top: 2px; }
  .brand .theme { margin-left: auto; }
  .rgroup { padding: 0 18px; margin: 14px 0 6px; }
  .rail ul { list-style: none; margin: 0; padding: 0; }
  .ritem { display: flex; gap: 10px; align-items: center; padding: 7px 18px; min-height: 36px;
    border-left: 2px solid transparent; color: var(--text2); text-decoration: none; font-size: 13px; }
  .ritem:hover { background: var(--hairline); color: var(--text); }
  .ritem[aria-current="page"] { background: var(--hairline); border-left-color: var(--accent);
    color: var(--text); font-weight: 600; }
  .ritem .nm { overflow-wrap: anywhere; min-width: 0; }
  .ritem small { display: block; font-size: 11px; font-weight: 400; color: var(--muted); }
  .ritem .ic { width: 18px; height: 18px; border-radius: 50%; flex: none; display: grid; place-items: center;
    border: 1.5px solid var(--faint); font-size: 10px; font-family: 'DM Mono', monospace; }
  .ic.ok { background: var(--ok); border-color: var(--ok); color: var(--raised); }
  .ic.run { border-color: var(--accent); }
  .ic.run::after { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--accent);
    animation: pulse 1.2s ease-in-out infinite; }
  .ic.bad { background: var(--warn); border-color: var(--warn); color: var(--raised); }
  .ic.new { border-style: dashed; color: var(--text2); }
  .railfoot { margin-top: auto; padding: 12px 12px 0; display: grid; gap: 8px; }
  .machine { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--muted); padding: 0 6px;
    display: flex; gap: 7px; align-items: center; }
  .machine i { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); flex: none; }
  .machine.gpu i { background: var(--ok); }
  .logbtn { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 8px;
    border: 1px solid transparent; background: none; font: 11px 'DM Mono', monospace; letter-spacing: .04em;
    color: var(--text2); cursor: pointer; text-align: left; min-height: 32px; }
  .logbtn:hover, .logbtn[aria-expanded="true"] { color: var(--text); border-color: var(--border); background: var(--hairline); }
  .logbtn .n { margin-left: auto; color: var(--muted); }
  .iconbtn { width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--border-hard);
    background: var(--surface); color: var(--text2); cursor: pointer; display: grid; place-items: center;
    font: 13px 'DM Mono', monospace; padding: 0; box-shadow: 0 1px 0 var(--sheen) inset; }
  .iconbtn:hover { background: var(--raised); color: var(--text); }

  /* ── Main panel ───────────────────────────────────────────────────────── */
  .main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .mhead { padding: 22px 32px 0; }
  .mhead h2 { font-size: 24px; font-weight: 600; letter-spacing: -.01em; margin: 4px 0 6px;
    overflow-wrap: anywhere; outline: none; }
  .titlerow { display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap; }
  .titlerow .tools { display: flex; gap: 6px; margin-left: auto; }
  .phrases { display: flex; flex-wrap: wrap; gap: 6px; margin: 2px 0 4px; }
  .say { display: inline-flex; align-items: center; gap: 6px; font: 13px 'DM Sans', sans-serif;
    min-height: 28px; padding: 3px 12px 3px 10px; border-radius: 14px; border: 1px solid var(--field-line);
    background: var(--hairline); color: var(--text2); cursor: pointer; }
  .say:hover { color: var(--text); border-color: var(--accent); }
  .say[aria-busy="true"] { border-color: var(--accent); color: var(--text); }
  .steps { list-style: none; display: flex; gap: 4px; margin: 16px 0 0; padding: 0;
    border-bottom: 1px solid var(--border); overflow-x: auto; }
  .steps a { display: flex; align-items: center; gap: 8px; padding: 8px 14px 10px; font-size: 13px;
    color: var(--muted); text-decoration: none; border-bottom: 2px solid transparent; margin-bottom: -1px;
    white-space: nowrap; min-height: 36px; }
  .steps a:hover { color: var(--text); }
  .steps a[aria-current="step"] { color: var(--text); font-weight: 600; border-bottom-color: var(--accent); }
  .steps .ic { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center;
    border: 1.5px solid var(--faint); font: 10px 'DM Mono', monospace; }
  .steps a[aria-current="step"] .ic:not(.ok) { border-color: var(--accent); background: var(--accent); color: var(--accent-tint); }

  .mbody { flex: 1; min-height: 0; overflow-y: auto; padding: 20px 32px 24px; }
  .mbody > * + * { margin-top: 14px; }
  .lead { font-size: 15px; color: var(--text2); line-height: 1.55; max-width: 62ch; }
  .mbody p { color: var(--text2); line-height: 1.55; max-width: 62ch; }
  .mbody h3 { font-size: 15px; font-weight: 600; margin-top: 22px; }
  .foot { border-top: 1px solid var(--border); padding: 12px 32px; display: flex; flex-wrap: wrap;
    align-items: center; gap: 10px 12px; min-height: 58px; }
  .foot .sp { flex: 1; }

  /* ── Content blocks, as the wizard draws them ─────────────────────────── */
  .checklist { list-style: none; padding: 0; margin-bottom: 0; margin-left: 0; margin-right: 0; display: grid; gap: 12px; max-width: 640px; }
  .checklist li { display: grid; grid-template-columns: 24px 1fr; gap: 12px; align-items: start; line-height: 1.45; }
  .checklist .ic { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center;
    font: 11px 'DM Mono', monospace; background: var(--hairline); border: 1px solid var(--border-hard); color: var(--text2); }
  .checklist .ic.ok { background: var(--ok); border-color: var(--ok); color: var(--raised); }
  .checklist .ic.run { border-color: var(--accent); background: none; }
  .checklist small { display: block; color: var(--muted); font-size: 12px; margin-top: 1px; }
  .checklist .pend { color: var(--muted); }
  .checklist .row { margin-top: 8px; }
  .status { display: flex; gap: 10px; align-items: center; padding: 10px 14px; border-radius: 8px; max-width: 640px;
    background: color-mix(in srgb, var(--accent) 12%, var(--hairline));
    border: 1px solid color-mix(in srgb, var(--accent) 25%, var(--border)); font-size: 13px; color: var(--text); }
  .status > i { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex: none;
    animation: pulse 1.4s ease-in-out infinite; }
  .status.ok { background: color-mix(in srgb, var(--ok) 12%, var(--hairline));
    border-color: color-mix(in srgb, var(--ok) 30%, var(--border)); }
  .status.ok > i, .status.bad > i, .status.still > i { animation: none; }
  .status.ok > i { background: var(--ok); }
  .status.bad { background: color-mix(in srgb, var(--error) 10%, var(--hairline));
    border-color: color-mix(in srgb, var(--error) 35%, var(--border)); }
  .status.bad > i { background: var(--error); }
  .status .sp { flex: 1; }
  .status .link, .warnbox a { color: var(--text); }
  .warnbox { display: grid; grid-template-columns: 22px 1fr; gap: 10px; padding: 12px 14px; border-radius: 8px;
    font-size: 13px; line-height: 1.5; max-width: 640px;
    background: color-mix(in srgb, var(--warn) 10%, var(--hairline));
    border: 1px solid color-mix(in srgb, var(--warn) 35%, var(--border)); color: var(--text); }
  .warnbox .ic { color: var(--warn); font-weight: 600; font-size: 16px; line-height: 1.2; }
  .bar { height: 6px; background: var(--sunken); border-radius: 3px; overflow: hidden; margin: 6px 0 3px; max-width: 420px;
    box-shadow: inset 0 0 0 1px var(--track); }
  .bar i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .4s linear; }
  .barlabel { font: 11px 'DM Mono', monospace; color: var(--muted); display: flex; gap: 12px; max-width: 420px; }
  .barlabel .sp { flex: 1; }
  .row { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; }
  .card { border: 1px solid var(--border); border-radius: 10px; padding: 16px 18px; background: var(--hairline);
    display: grid; gap: 10px; align-content: start; }
  .card h3 { margin: 0; font-size: 15px; }
  .card p { font-size: 13px; }
  .card + .card { margin-top: 0; }
  #verdict > * + *, #impStatus > * + * { margin-top: 10px; }

  /* Fields */
  .field { display: grid; gap: 6px; max-width: 460px; }
  .field > label, .field > .lbl { font-size: 13px; color: var(--text2); font-weight: 500; }
  .field .hint { font-size: 12px; color: var(--muted); line-height: 1.45; }
  input[type=text], input[type=number], select, textarea {
    font: inherit; font-size: 14px; color: var(--text); background: var(--raised);
    border: 1px solid var(--field-line); border-radius: 8px; padding: 8px 12px; width: 100%; min-height: 36px; }
  input.big { font-size: 17px; padding: 10px 14px; }
  ::placeholder { color: var(--muted); opacity: 1; }
  textarea { font: 12px/1.5 'DM Mono', monospace; min-height: 90px; resize: vertical; }
  select { cursor: pointer; }
  input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .fields2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; max-width: 460px; }
  .checks { display: flex; flex-wrap: wrap; gap: 8px 18px; }
  .checks label { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; cursor: pointer; min-height: 28px; }
  .checks input { width: 18px; height: 18px; accent-color: var(--accent); }
  .filebtn { position: relative; }
  .filebtn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; }
  .filebtn.is-disabled { background: linear-gradient(180deg, var(--sunken), var(--border)); color: var(--muted);
    border-color: var(--border-hard); box-shadow: none; }
  .filebtn.is-disabled input { cursor: not-allowed; }
  .filebtn:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 20px; }

  details.more { border-top: 1px solid var(--border-soft); padding-top: 10px; max-width: 640px; }
  details.more summary { cursor: pointer; color: var(--accent); font-size: 13px; min-height: 24px; }
  details.more[open] summary { margin-bottom: 12px; }
  details.more > * + * { margin-top: 12px; }
  .kv { display: grid; grid-template-columns: 90px 1fr; gap: 4px 12px; font-size: 13px; max-width: 640px; }
  .kv dt { color: var(--muted); }
  .kv dd { margin: 0; color: var(--text2); overflow-wrap: anywhere; }
  .files { list-style: none; padding: 0; margin: 0; font: 12px 'DM Mono', monospace; color: var(--muted);
    max-width: 640px; max-height: 220px; overflow-y: auto; }
  .files li { display: flex; justify-content: space-between; gap: 14px; padding: 2px 0; }
  .files b { font-weight: 400; color: var(--text2); overflow-wrap: anywhere; }
  .files span { white-space: nowrap; }
  code { font: 12px 'DM Mono', monospace; background: var(--hairline); border: 1px solid var(--border-soft);
    border-radius: 4px; padding: 0 4px; }

  /* The try-it meter: the score against the line the Echo wakes at. */
  .meter { position: relative; height: 10px; border-radius: 5px; background: var(--sunken); max-width: 420px;
    box-shadow: inset 0 0 0 1px var(--track); margin: 12px 0 4px; }
  .meter i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 5px; background: var(--accent); }
  .meter.ok i { background: var(--ok); }
  .meter b { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--text); left: 50%; }
  .meterlabel { font: 11px 'DM Mono', monospace; color: var(--muted); display: flex; justify-content: space-between; max-width: 420px; }
  .rec { width: 96px; height: 96px; border-radius: 50%; font-size: 14px; font-weight: 600; flex-direction: column; gap: 2px; }
  .rec[aria-pressed="true"] { background: linear-gradient(180deg, var(--error), var(--error-deep));
    color: var(--on-error); border-color: var(--error-deep); }
  .rec small { font-size: 11px; font-weight: 400; }

  /* Log flyout, over the main panel as the wizard's is. */
  .flyout { position: absolute; top: 0; bottom: 0; left: 240px; right: 0; z-index: 2; display: flex;
    flex-direction: column; gap: 12px; padding: 20px 24px;
    background: linear-gradient(170deg, var(--raised), var(--card)); border-left: 1px solid var(--border);
    box-shadow: -8px 0 24px rgba(0,0,0,.12); }
  .flyout[hidden] { display: none; }
  .flyout header { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .flyout header h2 { margin: 0; font-size: 16px; font-weight: 600; }
  .flyout header .sp { flex: 1; }
  .em-console { background: linear-gradient(160deg, var(--lcd-face), var(--lcd-bg)); border: 1px solid var(--lcd-line);
    border-radius: 8px; box-shadow: var(--shadow-inset); color: var(--lcd-green);
    font: 11px/1.7 'DM Mono', monospace; padding: 10px 14px; overflow-y: auto; flex: 1; margin: 0; white-space: pre-wrap; }

  /* Confirm dialog and error notice */
  dialog { border: 1px solid var(--border); border-radius: 12px; padding: 22px 24px; max-width: 440px;
    background: linear-gradient(170deg, var(--raised), var(--card)); color: var(--text); box-shadow: var(--shadow-card); }
  dialog::backdrop { background: rgba(0,0,0,.4); }
  dialog h2 { font-size: 17px; margin-bottom: 8px; }
  dialog p { color: var(--text2); line-height: 1.5; }
  dialog .row { justify-content: flex-end; margin-top: 18px; }
  .notice { margin: 0 32px; margin-top: 12px; }
  .notice:empty { display: none; }

  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
  @media (prefers-reduced-motion: reduce) {
    .ic.run::after, .status > i { animation: none; }
    .bar i, .em-pill { transition: none; }
  }

  /* Narrow: the rail stacks above the panel and the page scrolls as one. */
  @media (max-width: 860px) {
    body { padding: 0; }
    .app { grid-template-columns: 1fr; grid-template-rows: auto auto; height: auto; min-height: 100dvh;
      border-radius: 0; border: 0; }
    /* The rail becomes two scrolling rows of chips, so the page's own
       content is on the first screen rather than below a list. */
    .rail { border-right: 0; border-bottom: 1px solid var(--border); padding: 12px 0 10px; overflow: visible; }
    .brand { padding: 0 16px 10px; }
    .rgroup { display: none; }
    .rail ul { display: flex; gap: 6px; overflow-x: auto; padding: 2px 16px 6px; scrollbar-width: none; }
    .ritem { border: 1px solid var(--border-hard); border-radius: 18px; padding: 4px 12px 4px 6px; min-height: 36px;
      white-space: nowrap; flex: none; }
    .ritem[aria-current="page"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
    .ritem small { display: inline; margin-left: 6px; }
    .railfoot { flex-direction: row; display: flex; flex-wrap: wrap; align-items: center; padding: 4px 10px 0; }
    .mbody { overflow: visible; }
    .mhead, .mbody, .foot { padding-left: 16px; padding-right: 16px; }
    .notice { margin: 12px 16px 0; }
    .flyout { position: fixed; left: 0; }
  }
</style>
</head>
<body>
<a class="sr" href="#page">Skip to content</a>
<div class="app">
  <nav class="rail" aria-label="Wake words and setup">
    <div class="brand">
      <h1>Wake Word Forge<span>EchoMuse</span></h1>
      <button class="iconbtn theme" type="button" id="themeBtn" aria-label="Switch to dark theme">◐</button>
    </div>
    <div class="rgroup em-label" id="wwHead">Your wake words</div>
    <ul id="wwList" aria-labelledby="wwHead"></ul>
    <div class="rgroup em-label" id="setupHead">Setup</div>
    <ul id="setupList" aria-labelledby="setupHead"></ul>
    <div class="railfoot">
      <div class="machine" id="machine"><i></i><span>Connecting…</span></div>
      <button class="logbtn" type="button" id="logBtn" aria-expanded="false" aria-controls="flyout">Show log<span class="n" id="logNote"></span></button>
    </div>
  </nav>
  <main class="main" id="page" tabindex="-1">
    <div id="notice" class="notice" role="alert"></div>
    <div id="view" style="display:contents"></div>
  </main>
  <aside class="flyout" id="flyout" aria-labelledby="flyTitle" hidden>
    <header>
      <h2 id="flyTitle">Log</h2><span class="status still" id="flyStatus" style="padding:4px 10px"></span>
      <span class="sp"></span>
      <button class="em-pill em-pill--small" type="button" id="cancelJob" hidden>Stop</button>
      <button class="em-pill em-pill--small" type="button" id="logCopy">Copy</button>
      <button class="em-pill em-pill--small em-pill--accent" type="button" id="logClose">Close</button>
    </header>
    <pre class="em-console" id="logPre" role="log" aria-label="Job output" tabindex="0"></pre>
  </aside>
</div>
<div class="sr" id="live" aria-live="polite"></div>
<dialog id="renameDlg" aria-labelledby="rnTitle">
  <form id="rnForm">
    <h2 id="rnTitle">Rename</h2>
    <div class="field" style="margin-top:8px">
      <label for="rnInput">New name</label>
      <input type="text" id="rnInput" autocomplete="off" spellcheck="false" maxlength="64" aria-describedby="rnHint rnErr">
      <div class="hint" id="rnHint">Also the file name EchoMuse shows. A copy already added to EchoMuse keeps its old name.</div>
      <div class="hint" id="rnErr" role="alert" style="color:var(--error)"></div>
    </div>
    <div class="row">
      <button class="em-pill" type="button" id="rnCancel">Cancel</button>
      <button class="em-pill em-pill--accent" type="submit">Rename</button>
    </div>
  </form>
</dialog>
<dialog id="confirm" aria-labelledby="cfTitle" aria-describedby="cfBody">
  <form method="dialog">
    <h2 id="cfTitle"></h2>
    <p id="cfBody"></p>
    <div class="row">
      <button class="em-pill" value="no" autofocus>Cancel</button>
      <button class="em-pill" id="cfYes" value="yes"></button>
    </div>
  </form>
</dialog>

<script>
const $ = id => document.getElementById(id);
let state = null, logOffset = 0, lastJobKey = null;
let logDone = '', logTail = '';   // log lines already complete, and the line still being written
let lastView = null, lastRail = null, lastRoute = null, prevJob = null;
let voices = null;                // /api/voices, fetched when first needed
const verdicts = {};              // per wake word: the last try-it result, kept across re-renders
const flashes = {};               // per wake word and page: the last confirmation, kept the same way
const rates = {};                 // per wake word: progress samples, for time left
/* The new-word form outlives the page: leaving it to check something (the
   Google key, say) and coming back must not mean typing it all again. */
const DRAFT0 = {phrase: '', name: '', samples: '30000', steps: '50000'};
let draft = (() => { try { return {...DRAFT0, ...JSON.parse(sessionStorage.getItem('forge-draft') || '{}')}; } catch { return {...DRAFT0}; } })();
function saveDraft() { try { sessionStorage.setItem('forge-draft', JSON.stringify(draft)); } catch {} }

const THRESHOLD = 0.5;            // the Echo's default wake threshold
const STAGES = [                  // build stage, what it is called here, what it does
  ['generate', 'Make example voices', 'Thousands of clips of the phrase, in many different voices.'],
  ['augment', 'Add room sound and noise', 'So it still works across a room, with the TV or music on.'],
  ['train', 'Train the model', 'Teach it to tell the phrase apart from everything else.'],
];
const STEPS = [['train', 'Train'], ['try', 'Try it'], ['improve', 'Improve'], ['use', 'Use it']];

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const enc = encodeURIComponent;
const n0 = n => Number(n || 0).toLocaleString();

/* Errors appear at the top of the panel instead of an alert(): an alert
   blocks the page and loses the message the moment it is dismissed. */
function notice(msg) {
  $('notice').innerHTML = msg ? `<div class="status bad"><i></i><span>${esc(msg)}</span><span class="sp"></span>
    <button class="link quiet" type="button" onclick="notice('')">Dismiss</button></div>` : '';
}
async function api(path, opts) {
  const r = await fetch(path, opts);
  if (!r.ok) { const t = await r.text(); notice(t || `${r.status} ${r.statusText}`); throw new Error(path); }
  notice('');
  return r.json();
}
const post = (path, body) => api(path, {method: 'POST', headers: {'Content-Type': 'application/json'},
  body: JSON.stringify(body || {})});
function announce(msg) { $('live').textContent = ''; setTimeout(() => { $('live').textContent = msg; }, 50); }

function confirmDialog(title, body, yes, danger) {
  const d = $('confirm');
  $('cfTitle').textContent = title; $('cfBody').textContent = body;
  $('cfYes').textContent = yes; $('cfYes').className = 'em-pill ' + (danger ? 'em-pill--danger' : 'em-pill--accent');
  d.returnValue = '';
  d.showModal();
  return new Promise(res => d.addEventListener('close', () => res(d.returnValue === 'yes'), {once: true}));
}

function fmtWhen(ts) {
  const d = new Date(ts * 1000);
  return d.toLocaleDateString([], {day: 'numeric', month: 'short'}) + ', ' +
         d.toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'});
}
function fmtLeft(s) {
  if (s < 90) return 'less than 2 minutes';
  if (s < 3600) return `about ${Math.round(s / 60)} minutes`;
  const h = s / 3600;
  return `about ${h < 10 ? h.toFixed(1).replace(/\.0$/, '') : Math.round(h)} hours`;
}

/* ── What is going on ─────────────────────────────────────────────────── */
function busy() { return !!(state && state.job && state.job.running); }
const jobFor = name => busy() && state.job.label.includes(`'${name}'`);
const wwByName = name => state.wakewords.find(w => w.name === name);
const dataReady = () => state.assets.every(a => a.present);

/* Friendly names for the job the log and the rail show */
function friendlyJob(label) {
  return label
    .replace(/^downloading assets.*/, 'Downloading voice data')
    .replace(/^building '(.+)'$/, 'Training “$1”')
    .replace(/^Google TTS × (\d+) \((.+)\) for '(.+)'$/, 'Adding $1 Google voices ($2) to “$3”')
    .replace(/^(\S+) voices × (\d+) for '(.+)'$/, 'Adding $2 $1 voices to “$3”');
}
function busyReason() { return busy() ? `Waiting for: ${friendlyJob(state.job.label)}.` : ''; }

function wwStatus(w) {
  if (jobFor(w.name) && state.job.kind === 'build') {
    const p = w.progress;
    const i = p ? STAGES.findIndex(s => s[0] === p.stage) : -1;
    return ['run', i >= 0 ? `Training · step ${i + 1} of ${STAGES.length}` : 'Training'];
  }
  if (jobFor(w.name)) return ['run', 'Adding voices'];
  if (w.model_built) return ['ok', 'Ready'];
  if (w.clips_train > 0) return ['bad', 'Half trained'];
  return ['', 'Not trained yet'];
}

/* Time left in the running stage, from how fast it has moved across polls.
   Only shown once there is enough to go on: a guess from one sample is worse
   than none. */
function timeLeft(w) {
  const p = w.progress; if (!p || !p.total) return null;
  const r = rates[w.name] ||= {};
  const now = Date.now() / 1000;
  if (r.stage !== p.stage || p.done < (r.done ?? 0)) Object.assign(r, {stage: p.stage, t0: now, d0: p.done, n: 0});
  if (p.done !== r.done) { r.done = p.done; r.n++; }
  const dt = now - r.t0, dd = p.done - r.d0;
  if (r.n < 3 || dt < 20 || dd <= 0) return null;
  return (p.total - p.done) / (dd / dt);
}

/* ── Routing: #/new, #/data, #/google, #/w/<name>/<step> ──────────────── */
function route() {
  const parts = location.hash.replace(/^#\/?/, '').split('/').map(decodeURIComponent);
  if (parts[0] === 'w' && parts[1] && state && !wwByName(parts[1])) return {page: 'missing', name: parts[1]};
  if (parts[0] === 'w' && parts[1] && state) {
    const w = wwByName(parts[1]);
    const step = STEPS.some(s => s[0] === parts[2]) ? parts[2] : (w.model_built ? 'try' : 'train');
    return {page: 'ww', name: parts[1], step};
  }
  if (['new', 'data', 'google'].includes(parts[0])) return {page: parts[0]};
  return {page: 'home'};
}
const href = (...p) => '#/' + p.map(enc).join('/');

/* ── Rail ─────────────────────────────────────────────────────────────── */
function renderRail(r) {
  const cur = (page, name) => (r.page === page && (!name || r.name === name)) ? ' aria-current="page"' : '';
  const ww = state.wakewords.map(w => {
    const [cls, text] = wwStatus(w);
    return `<li><a class="ritem" href="${href('w', w.name)}"${cur('ww', w.name)}>
      <span class="ic ${cls}" aria-hidden="true">${cls === 'ok' ? '✓' : cls === 'bad' ? '!' : ''}</span>
      <span class="nm">${esc(w.name)}<small>${esc(text)}</small></span></a></li>`;
  }).join('') + `<li><a class="ritem" href="#/new"${cur('new')}>
      <span class="ic new" aria-hidden="true">+</span><span class="nm">New wake word</span></a></li>`;
  const missing = state.assets.filter(a => !a.present).length;
  const dl = busy() && state.job.kind === 'assets';
  const g = state.google || {};
  const setup = `
    <li><a class="ritem" href="#/data"${cur('data')}>
      <span class="ic ${dl ? 'run' : missing ? 'bad' : 'ok'}" aria-hidden="true">${dl ? '' : missing ? '!' : '✓'}</span>
      <span class="nm">Voice data<small>${dl ? 'Downloading' : missing ? 'Needed before training' : 'Downloaded'}</small></span></a></li>
    <li><a class="ritem" href="#/google"${cur('google')}>
      <span class="ic ${g.valid ? 'ok' : ''}" aria-hidden="true">${g.valid ? '✓' : ''}</span>
      <span class="nm">Google voices<small>${g.valid ? 'Connected' : g.present ? 'Key unreadable' : 'Optional'}</small></span></a></li>`;
  const html = ww + '§' + setup;
  if (html === lastRail) return;
  lastRail = html;
  $('wwList').innerHTML = ww; $('setupList').innerHTML = setup;
}

function renderMachine() {
  const g = state.gpu || {};
  const lost = state.job && state.job.cpu_fallback;
  $('machine').className = 'machine' + (g.available && !lost ? ' gpu' : '');
  $('machine').lastElementChild.textContent = lost ? 'GPU not reachable: restart the forge'
    : g.available ? `GPU · ${g.device}` : 'No GPU: training is slower';
}

/* ── Pages ────────────────────────────────────────────────────────────── */
function frame({eyebrow, title, head = '', body, foot = '', tools = ''}) {
  return `<div class="mhead"><div class="em-label">${esc(eyebrow)}</div>
    <div class="titlerow"><h2 id="title" tabindex="-1">${esc(title)}</h2>${tools}</div>${head}</div>
    <div class="mbody">${body}</div>
    <div class="foot">${foot}</div>`;
}
const step = (ic, cls, text, small = '', extra = '') =>
  `<li><span class="ic ${cls}" aria-hidden="true">${ic}</span><div class="${cls === 'pend' ? 'pend' : ''}">${text}${small ? `<small>${small}</small>` : ''}${extra}</div></li>`;

function pageHome() {
  const ready = dataReady();
  const any = state.wakewords.length;
  return frame({eyebrow: 'Welcome', title: 'Make your own wake word',
    body: `
      <p class="lead">Train a wake word your Echos will answer to, such as “hey verona”. The forge makes
        thousands of example voices saying it, teaches a small model to recognise it, and gives you a file to add to EchoMuse.</p>
      <ul class="checklist">
        ${step(ready ? '✓' : '1', ready ? 'ok' : '', 'Download the voice data', 'Once only, about 25 GB.')}
        ${step(any ? '✓' : '2', any ? 'ok' : '', 'Type your phrase and train it', 'Training runs by itself. You can close this page and come back.')}
        ${step('3', '', 'Try it with your own voice')}
        ${step('4', '', 'Add it to EchoMuse')}
      </ul>`,
    foot: `<span class="sp"></span>${ready
      ? `<a class="em-pill em-pill--accent em-pill--big" href="#/new">New wake word</a>`
      : `<a class="em-pill em-pill--accent em-pill--big" href="#/data">Get the voice data</a>`}`});
}

function pageData() {
  const missing = state.assets.filter(a => !a.present);
  const dl = busy() && state.job.kind === 'assets';
  const ended = !busy() && state.job && state.job.kind === 'assets';
  const items = state.assets.map(a => step(a.present ? '✓' : dl ? '' : '', a.present ? 'ok' : dl ? 'run' : '',
    esc(a.label), a.present ? esc(a.detail) : dl ? 'Downloading' : 'Not downloaded')).join('');
  let status = '';
  if (dl) status = `<div class="status"><i></i>Downloading. It carries on if you close this page.</div>`;
  else if (!missing.length) status = `<div class="status ok"><i></i>All downloaded. You're ready to train.</div>`;
  else if (ended && !state.job.cancelled && state.job.rc) status = `<div class="status bad"><i></i>The download stopped with an error.
      <button class="link" type="button" data-act="log">Show the log</button></div>`;
  return frame({eyebrow: 'Setup', title: 'Voice data',
    body: `
      <p class="lead">Training needs example voices and background sounds to learn from. It's a one-time
        download of about 25 GB, kept in the forge's <code>data</code> folder.</p>
      ${status}
      <ul class="checklist">${items}</ul>
      ${missing.length && !dl && busy() ? `<p>${esc(busyReason())}</p>` : ''}`,
    foot: `<span class="sp"></span>${missing.length
      ? `<button class="em-pill em-pill--accent em-pill--big" type="button" data-act="download" ${busy() ? 'disabled' : ''}>
           ${dl ? 'Downloading…' : state.assets.some(a => a.present) ? 'Download the rest' : 'Download voice data'}</button>`
      : `<a class="em-pill em-pill--accent" href="${state.wakewords.length ? href('w', state.wakewords[0].name) : '#/new'}">
           ${state.wakewords.length ? 'Back to your wake words' : 'New wake word'}</a>`}`});
}

function pageGoogle() {
  const g = state.google || {};
  const body = g.present && g.valid ? `
      <div class="status ok still"><i></i>Connected. Add Google voices to a wake word from its Improve step.</div>
      <dl class="kv"><dt>Project</dt><dd>${esc(g.project_id || '—')}</dd><dt>Account</dt><dd>${esc(g.client_email || '—')}</dd></dl>
      <div id="gVerdict" aria-live="polite"></div>
      <div class="row"><button class="em-pill" type="button" data-act="gcheck">Test the connection</button>
        <button class="link quiet" type="button" data-act="gremove">Remove the key</button></div>` : `
      ${g.present ? `<div class="status bad"><i></i>The saved key can't be read: ${esc(g.error || 'unknown error')}</div>` : ''}
      <h3>Connect a Google account</h3>
      <ol class="checklist">
        ${step('1', '', 'In the Google Cloud console, turn on the <b>Text-to-Speech API</b>.')}
        ${step('2', '', 'Go to <b>IAM &amp; Admin → Service Accounts</b> and create one.')}
        ${step('3', '', 'On that account, <b>Keys → Add key → JSON</b>. A file downloads.')}
        ${step('4', '', 'Choose that file here.')}
      </ol>
      <div class="field">
        <label for="gFile">Key file (.json)</label>
        <input type="file" id="gFile" accept="application/json,.json">
      </div>
      <details class="more"><summary>Or paste the key instead</summary>
        <div class="field"><label for="gPaste">Key contents</label>
        <textarea id="gPaste" placeholder='{ "type": "service_account", … }'></textarea></div>
      </details>
      <div id="gVerdict" aria-live="polite"></div>`;
  return frame({eyebrow: 'Setup · optional', title: 'Google voices',
    body: `<p class="lead">The built-in voices are American. Google adds British, Australian and other
      English accents, so the wake word learns how your household actually says it. A typical run
      uses about 2% of Google's free monthly allowance.</p>${body}`,
    foot: `<span class="sp"></span>${g.valid ? '' : `<button class="em-pill em-pill--accent" type="button" data-act="gsave">Save key</button>`}`});
}

/* Mirrors forge.default_name: the first spelling, slugified. */
function defaultName(phrase) {
  const first = (phrase || '').split(',').map(p => p.trim()).find(Boolean) || '';
  return first.toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '');
}
function pageMissing(r) {
  return frame({eyebrow: 'Wake word', title: 'Not found',
    body: `<p class="lead">There's no wake word called “${esc(r.name)}”. It may have been renamed or deleted.</p>`,
    foot: `<span class="sp"></span><a class="em-pill em-pill--accent" href="#/new">New wake word</a>`});
}
function pageNew() {
  return frame({eyebrow: 'New wake word', title: 'What should your Echo answer to?',
    body: `
      ${dataReady() ? '' : `<div class="warnbox"><span class="ic" aria-hidden="true">!</span><div>
        You can create it now, but training needs the <a href="#/data">voice data</a> first.</div></div>`}
      <div class="field">
        <label for="newPhrase">Wake phrase</label>
        <input class="big" type="text" id="newPhrase" autocomplete="off" spellcheck="false"
          placeholder="hey verona" aria-describedby="phraseHint" value="${esc(draft.phrase)}">
        <div class="hint" id="phraseHint">Three or four syllables work best. Avoid words people say all the time.</div>
      </div>
      <div class="row">
        <button class="em-pill" type="button" data-act="hear-new">▶ Hear it</button>
        <span class="hint" id="hearNote" aria-live="polite"></span>
      </div>
      <details class="more"><summary>The voices say it wrong</summary>
        <p>The built-in voices are American. Add how your household says it as another spelling, separated by a comma:
          <code>hey clara, hey clarra</code>. One wake word listens for every spelling. Press <b>Hear it</b> to check each one.</p>
      </details>
      <div class="field">
        <label for="newName">Name</label>
        <input type="text" id="newName" autocomplete="off" maxlength="64" value="${esc(draft.name)}"
          placeholder="${esc(defaultName(draft.phrase) || 'Made from the phrase')}" aria-describedby="nameHint">
        <div class="hint" id="nameHint">What it's called here and in EchoMuse. You can rename it later.</div>
      </div>
      <details class="more"${draft.samples !== DRAFT0.samples || draft.steps !== DRAFT0.steps ? ' open' : ''}><summary>Advanced settings</summary>
        <div class="fields2">
          <div class="field"><label for="newSamples">Example voices</label>
            <input type="text" inputmode="numeric" id="newSamples" value="${esc(draft.samples)}"></div>
          <div class="field"><label for="newSteps">Training steps</label>
            <input type="text" inputmode="numeric" id="newSteps" value="${esc(draft.steps)}"></div>
        </div>
        <p class="hint">More of either takes longer. The defaults suit most phrases.</p>
      </details>`,
    foot: `<span class="sp"></span><button class="em-pill em-pill--accent em-pill--big" type="button" data-act="create">Create</button>`});
}

function wwTools(w) {
  const dis = jobFor(w.name) ? ` disabled title="Stop the job running for it first"` : '';
  return `<div class="tools">
    <button class="em-pill em-pill--small" type="button" data-act="rename"${dis}>Rename</button>
    <button class="em-pill em-pill--small" type="button" data-act="del"${dis}>Delete</button></div>`;
}
function wwHead(w, r) {
  const n = STEPS.findIndex(s => s[0] === r.step);
  const done = {train: w.model_built};
  return `<div class="phrases" role="group" aria-label="Hear each spelling">${w.phrases.map(p =>
      `<button class="say" type="button" data-say="${esc(p)}">▶ <span>“${esc(p)}”</span></button>`).join('')}</div>
    <ol class="steps">${STEPS.map(([id, label], i) =>
      `<li><a href="${href('w', w.name, id)}"${i === n ? ' aria-current="step"' : ''}>
        <span class="ic ${done[id] ? 'ok' : ''}" aria-hidden="true">${done[id] ? '✓' : i + 1}</span>${label}</a></li>`).join('')}</ol>`;
}

/* The recordings someone uploaded, so the page can say the trainer still has
   them after a refresh. The names are the uploader's own (real_<epoch>_<i>.wav)
   — the name they uploaded under is not kept, so size and time are all there
   is. Nothing at all when there are none. */
function recList(w, moreHref) {
  const n = w.recordings || 0;
  if (!n) return '';
  const more = moreHref ? `<a class="em-pill em-pill--small" href="${moreHref}">Add more</a>` : '';
  return `<details class="more" data-keep="recordings"><summary>Your recordings (${n0(n)})</summary>
    <ul class="files">${(w.recording_files || []).map(f =>
      `<li><b>${esc(f.name)}</b><span>${n0(f.kb)} KB · ${esc(fmtWhen(f.mtime))}</span></li>`).join('')}</ul>
    <div class="row">${more}<span class="hint">Already in the training set — retrain to use them.</span></div>
  </details>`;
}

function pageTrain(w) {
  const mine = jobFor(w.name) && state.job.kind === 'build';
  const p = mine ? w.progress : null;
  const at = p ? STAGES.findIndex(s => s[0] === p.stage) : -1;
  const doneFlags = [w.clips_train >= w.n_samples, w.features_built, w.model_built];
  const failed = !busy() && state.job && state.job.kind === 'build' && state.job.label.includes(`'${w.name}'`)
                 && !state.job.cancelled && state.job.rc;
  const list = STAGES.map(([id, label, what], i) => {
    if (i === at) return `<li><span class="ic run" aria-hidden="true"></span><div><b>${label}</b><small>${what}</small>
        <div class="bar" role="progressbar" aria-label="${label}" aria-valuemin="0" aria-valuemax="100" data-stage="${id}"><i></i></div>
        <div class="barlabel"><span class="count" data-stage="${id}"></span><span class="sp"></span><span class="left" data-stage="${id}"></span></div></div></li>`;
    const ok = doneFlags[i] && !(mine && i > at);
    return step(ok ? '✓' : i + 1, ok ? 'ok' : 'pend', label, what);
  }).join('');
  let status;
  if (mine) status = `<div class="status"><i></i><span>Training. It carries on if you close this page.</span><span class="sp"></span>
      <button class="em-pill em-pill--small" type="button" data-act="stop">Stop</button></div>`;
  else if (failed) status = `<div class="status bad"><i></i><span>Training stopped with an error.</span><span class="sp"></span>
      <button class="link" type="button" data-act="log">Show the log</button></div>`;

  const msg = heard ? 'Heard it. Your Echo would wake.'
    : v.best >= 0.2 ? 'Close, but not enough to wake the Echo.'
    : 'Not recognised.';
  const tip = heard ? '' : `<p>Try again a little closer. If it keeps missing you, add your own recordings in
    <a href="${href('w', w.name, 'improve')}">Improve</a> and retrain.</p>`;
  return `<div class="status ${heard ? 'ok' : 'bad'} still"><i></i><b>${msg}</b></div>
    <div class="meter ${heard ? 'ok' : ''}" role="meter" aria-label="Wake score" aria-valuemin="0" aria-valuemax="1"
      aria-valuenow="${v.best.toFixed(2)}" aria-valuetext="${v.best.toFixed(2)}, wakes at ${THRESHOLD}"><i style="width:${pct}%"></i><b></b></div>
    <div class="meterlabel"><span>Score ${v.best.toFixed(2)}</span><span>Wakes at ${THRESHOLD}</span><span>1.0</span></div>${tip}` + rawOut(v);
}

/* ── Render ───────────────────────────────────────────────────────────── */
function view(r) {
  if (r.page === 'ww') {
    const w = wwByName(r.name);
    return {train: pageTrain, try: pageTry, improve: pageImprove, use: pageUse}[r.step](w);
  }
  if (r.page === 'home' && state.wakewords.length) {
    location.replace(href('w', state.wakewords[0].name));
    return null;
  }
  if (r.page === 'missing') return pageMissing(r);
  return {home: pageHome, data: pageData, google: pageGoogle, new: pageNew}[r.page]();
}

function render() {
  const r = route();
  const key = JSON.stringify(r);
  const navigated = key !== lastRoute;
  renderRail(r); renderMachine();
  const html = view(r);
  if (html == null) return;
  if (!navigated && html === lastView) return;
  // The poll re-renders every 2.5s. Never while something is being typed or
  // chosen in the panel, or it would wipe the field; a button keeping focus
  // after a click is not "typing", or pressing one would freeze the page.
  const host = $('view'), ae = document.activeElement;
  if (!navigated && ae && host.contains(ae) && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName) && ae.type !== 'file'
      && ae.type !== 'checkbox') return;
  const open = new Set([...host.querySelectorAll('details[open]')].map(d => d.querySelector('summary').textContent));
  const scroll = host.querySelector('.mbody')?.scrollTop || 0;
  host.innerHTML = html;
  lastView = html; lastRoute = key;
  for (const d of host.querySelectorAll('details'))
    if (open.has(d.querySelector('summary').textContent) && !navigated) d.open = true;
  if (!navigated) { const b = host.querySelector('.mbody'); if (b) b.scrollTop = scroll; }
  document.title = `${$('title')?.textContent || 'Wake Word Forge'} · Wake Word Forge`;
  if (navigated && r.page === 'ww' && r.step === 'improve' && !voices) loadVoices();
  paintProgress();
}

/* The bar, count and time left move every poll; set in place so the page
   markup stays stable between polls. */
function paintProgress() {
  for (const w of state.wakewords) {
    const p = w.progress;
    if (!p || !p.total) continue;
    const left = timeLeft(w);
    const bar = document.querySelector(`.bar[data-stage="${p.stage}"]`);
    if (!bar || route().name !== w.name) continue;
    const pct = Math.min(100, 100 * p.done / p.total);
    bar.firstElementChild.style.width = `${pct.toFixed(1)}%`;
    bar.setAttribute('aria-valuenow', pct.toFixed(0));
    document.querySelector(`.count[data-stage="${p.stage}"]`).textContent = `${n0(p.done)} of ${n0(p.total)}`;
    document.querySelector(`.left[data-stage="${p.stage}"]`).textContent = left == null ? 'Working out time left…' : `${fmtLeft(left)} left`;
  }
}

function renderJob() {
  const j = state.job;
  $('logBtn').disabled = !j;
  $('logNote').textContent = !j ? '' : j.running ? '● running' : j.cancelled ? 'stopped' : j.rc === 0 ? 'finished' : 'failed';
  if (!j) return;
  const key = j.kind + j.started;
  if (key !== lastJobKey) { lastJobKey = key; logOffset = 0; logDone = logTail = ''; $('logPre').textContent = ''; }
  $('flyTitle').textContent = friendlyJob(j.label);
  const s = $('flyStatus');
  s.className = 'status still ' + (j.running ? '' : j.rc === 0 ? 'ok' : j.cancelled ? '' : 'bad');
  s.innerHTML = `<i></i>${j.running ? 'Running' : j.cancelled ? 'Stopped' : j.rc === 0 ? 'Finished' : 'Failed'}`;
  $('cancelJob').hidden = !j.running;
  // Say it when a job ends, once: that is the moment someone waiting needs.
  if (prevJob && prevJob.running && !j.running && prevJob.started === j.started)
    announce(`${friendlyJob(j.label)}: ${j.cancelled ? 'stopped' : j.rc === 0 ? 'finished' : 'failed'}.`);
  prevJob = j;
}

// tqdm (train.py, the augmenter) redraws its bar with \r: keep only the
// last redraw of each line, or a progress bar arrives as thousands of
// near-identical lines and pushes everything useful out of the buffer.
const collapseCr = t => t.replace(/[^\r\n]*\r(?=[^\n])/g, '');

// Fold a chunk of raw log into [done, tail]: committed whole lines, and the
// line still being written. A line can straddle two reads, so the tail is
// shown but not committed until its newline arrives: a live bar keeps
// updating in place, and the 100k trim only ever eats committed history,
// never the line being redrawn. (Tested by tests/console_log.test.mjs.)
function foldLog(done, tail, data) {
  const buf = tail + data, cut = buf.lastIndexOf('\n') + 1;
  return [(done + collapseCr(buf.slice(0, cut))).slice(-100000), collapseCr(buf.slice(cut))];
}

async function pollLog() {
  if (!state || !state.job) return;
  const r = await (await fetch(`/api/log?offset=${logOffset}`)).json();
  if (r.data) {
    logOffset = r.offset;
    const pre = $('logPre');
    const stick = pre.scrollTop + pre.clientHeight >= pre.scrollHeight - 30;
    [logDone, logTail] = foldLog(logDone, logTail, r.data);
    pre.textContent = logDone + logTail;
    if (stick) pre.scrollTop = pre.scrollHeight;
  }
}

async function refresh() {
  try {
    const r = await fetch('/api/state');
    if (!r.ok) throw new Error();
    state = await r.json();
  } catch { $('machine').lastElementChild.textContent = 'Can’t reach the forge'; return; }
  renderJob(); render();
}

async function loadVoices() {
  try { voices = await api('/api/voices'); } catch { return; }

/* ── Sounds ───────────────────────────────────────────────────────────── */
/* Speak a phrase so it can be judged by ear before a training run. The first
   call downloads the voice (~77MB) and takes a moment; after that it is
   roughly instant. */
let previewing = false;
async function say(text, btn) {
  if (previewing) return;
  previewing = true;
  btn?.setAttribute('aria-busy', 'true');
  try {
    const r = await fetch('/api/preview', {method: 'POST',
      headers: {'Content-Type': 'application/json'}, body: JSON.stringify({text})});
    if (!r.ok) { notice(await r.text()); return; }
    const url = URL.createObjectURL(await r.blob());
    const a = new Audio(url);
    // Wait for it, so several spellings play in order rather than together.
    await new Promise(res => { a.onended = a.onerror = res; a.play().catch(res); });
    URL.revokeObjectURL(url);
  } finally {
    previewing = false;
    btn?.removeAttribute('aria-busy');
  }
}

/* Turn `forge.py test` output into a score. */
function parseTest(output) {
  const scores = [...output.matchAll(/peak score ([\d.]+)/g)].map(m => +m[1]);
  return {best: scores.length ? Math.max(...scores) : null, output};
}
function setVerdict(name, v) { verdicts[name] = v; lastView = null; render(); }
async function scoreFiles(name, files, fieldName = 'wav') {
  const fd = new FormData();
  for (const f of files) fd.append(fieldName, f, f.name || 'mic.webm');
  setVerdict(name, {pending: 'Scoring…'});
  try {
    const r = await api(`/api/wakewords/${enc(name)}/test`, {method: 'POST', body: fd});
    setVerdict(name, parseTest(r.output));
  } catch { setVerdict(name, null); }
}

let recorder = null;
async function toggleMic(btn, name) {
  if (recorder) { recorder.stop(); return; }
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({audio: true}); }
  catch { notice('The microphone was blocked. Allow it for this page, or test a recording instead.'); return; }
  const rec = new MediaRecorder(stream), chunks = [];
  recorder = rec;
  rec.ondataavailable = e => chunks.push(e.data);
  rec.onstop = () => {
    stream.getTracks().forEach(t => t.stop());
    recorder = null; clearInterval(tick);
    scoreFiles(name, [new File(chunks, 'mic.webm', {type: rec.mimeType})]);
  };
  rec.start();
  btn.setAttribute('aria-pressed', 'true');
  btn.querySelector('.lbl').textContent = 'Listening';
  let left = 5;
  const tick = setInterval(() => {
    left--;
    const s = btn.querySelector('small'); if (s) s.textContent = left > 0 ? `${left}s · press to stop` : '';
    if (left <= 0 && recorder === rec) rec.stop();
  }, 1000);
  btn.querySelector('small').textContent = '5s · press to stop';
}

    d.showModal(); $('rnInput').select();

      const to = $('rnInput').value.trim();
      if (!to || to === name) { d.close(); return; }
      const r = await fetch(`/api/wakewords/${enc(name)}/rename`, {method: 'POST',
        headers: {'Content-Type': 'application/json'}, body: JSON.stringify({name: to})});
      if (!r.ok) { $('rnErr').textContent = await r.text(); $('rnInput').focus(); return; }
      for (const k of Object.keys(flashes)) if (k.startsWith(name + '/')) { flashes[to + k.slice(name.length)] = flashes[k]; delete flashes[k]; }
      if (verdicts[name]) { verdicts[to] = verdicts[name]; delete verdicts[name]; }
      d.close();
      await refresh();
      location.hash = href('w', to, step || 'train');
      announce(`Renamed to ${to}.`);
    };
  },
  async gsave() {
    const file = $('gFile').files[0], pasted = $('gPaste').value.trim();
    if (!file && !pasted) { notice('Choose the key file, or paste its contents.'); return; }
    await api('/api/google', {method: 'PUT', headers: {'Content-Type': 'application/json'}, body: file || pasted});
    await refresh();
    ACTIONS.gcheck();
  },
  async gcheck() {
    const out = () => $('gVerdict');
    if (out()) out().innerHTML = `<div class="status"><i></i>Asking Google…</div>`;
    const r = await post('/api/google/check');
    lastView = null; render();
    if (out()) out().innerHTML = r.ok
      ? `<div class="status ok"><i></i>Working: ${n0(r.voices)} voices in ${n0(r.languages)} languages.</div>`
      : `<div class="status bad"><i></i>${esc(r.error)}</div>`;
  },
  async gremove() {
    if (!await confirmDialog('Remove the Google key?', 'Wake words keep the Google voices they already have.', 'Remove', true)) return;
    await api('/api/google', {method: 'DELETE'}); refresh();
  },
};
/* A confirmation is state, not DOM: the poll redraws the page, and a message
   written straight into it vanished on the next poll after a save. */
function flash(page, cls, msg) { flashes[route().name + '/' + page] = msg ? {cls, msg} : null; lastView = null; render(); }
const impStatus = (cls, msg) => flash('improve', cls, msg);
function flashHtml(name, page) {
  const f = flashes[name + '/' + page];
  return f ? `<div class="status ${f.cls} still"><i></i>${esc(f.msg)}</div>` : '';
}

$('view').addEventListener('click', async e => {
  const sayBtn = e.target.closest('button[data-say]');
  if (sayBtn) { say(sayBtn.dataset.say, sayBtn); return; }
  const btn = e.target.closest('button[data-act]');
  if (!btn || btn.disabled) return;
  const r = route();
  try { await ACTIONS[btn.dataset.act](btn, r.name); } catch {}
});
$('view').addEventListener('change', async e => {
  const input = e.target.closest('input[type=file][data-act]');
  if (!input || !input.files.length) return;
  const name = route().name, files = [...input.files];
  input.value = '';
  if (input.dataset.act === 'testfile') { scoreFiles(name, files); return; }
  const fd = new FormData();
  for (const f of files) fd.append('audio', f);
  impStatus('', `Adding ${files.length} recording${files.length === 1 ? '' : 's'}…`);
  try {
    const r = await api(`/api/wakewords/${enc(name)}/samples`, {method: 'POST', body: fd});
    impStatus(r.errors.length ? 'bad' : 'ok', `Added ${r.added} recording${r.added === 1 ? '' : 's'}.` +
      (r.errors.length ? ` ${r.errors.length} couldn't be read.` : '') + ' Retrain to use them.');
  } catch { impStatus('', ''); }
});
const DRAFT_FIELDS = {newPhrase: 'phrase', newName: 'name', newSamples: 'samples', newSteps: 'steps'};
$('view').addEventListener('input', e => {
  const k = DRAFT_FIELDS[e.target.id]; if (!k) return;
  draft[k] = e.target.value; saveDraft();
  if (k === 'phrase') $('newName').placeholder = defaultName(draft.phrase) || 'Made from the phrase';
});
$('view').addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'newPhrase') ACTIONS.create().catch(() => {});
});

async function stopJob() {
  if (!await confirmDialog('Stop this run?', 'Work already done is kept. Starting again picks up where it left off.', 'Stop')) return;
  await api('/api/job/cancel', {method: 'POST'});
  refresh();
}
$('rnCancel').onclick = () => $('renameDlg').close();
$('cancelJob').onclick = () => stopJob().catch(() => {});

function openLog() {
  $('flyout').hidden = false; $('logBtn').setAttribute('aria-expanded', 'true');
  const pre = $('logPre'); pre.scrollTop = pre.scrollHeight; $('logClose').focus();
}
function closeLog() { $('flyout').hidden = true; $('logBtn').setAttribute('aria-expanded', 'false'); $('logBtn').focus(); }
$('logBtn').onclick = () => $('flyout').hidden ? openLog() : closeLog();
$('logClose').onclick = closeLog;
$('flyout').addEventListener('keydown', e => { if (e.key === 'Escape') closeLog(); });
$('logCopy').onclick = async () => {
  try { await navigator.clipboard.writeText($('logPre').textContent); announce('Log copied.'); }
  catch { const s = getSelection(), rg = document.createRange(); rg.selectNodeContents($('logPre')); s.removeAllRanges(); s.addRange(rg); }
};

function themeLabel() {
  const dark = document.documentElement.getAttribute('data-theme') === 'dark';
  $('themeBtn').setAttribute('aria-label', dark ? 'Switch to light theme' : 'Switch to dark theme');
}
$('themeBtn').onclick = () => {
  const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem('em-theme', next); } catch (e) {}
  themeLabel();
};
themeLabel();

addEventListener('hashchange', () => { render(); $('title')?.focus(); });

refresh();
setInterval(refresh, 2500);
setInterval(pollLog, 1000);
</script>
</body>
</html>
